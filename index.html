  for(let i=0;i<6;i++){
    const c=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.45,1+B()*2.6,6),stone);
    c.position.set((B()-0.5)*10,0.5+B()*0.8,(B()-0.5)*8);
    c.rotation.z=(B()-0.5)*0.5;
    grp.add(c);
  }
  const slab=new THREE.Mesh(new THREE.BoxGeometry(5,0.5,3),stone);
  slab.position.y=0.25; grp.add(slab);
  grp.position.y=groundY(at.x,at.z,Bubble.setId);
  Bubble.group.add(grp);
}

/* ---------- the furniture of rank ---------- */
function buildFurniture(s,f,B,placed,setId){
  const stone=new THREE.MeshLambertMaterial({color:0x8a8074});
  const wood=new THREE.MeshLambertMaterial({color:0x6a4a30});
  if(s.kind!=='capital'){
    // the well: a ring, two posts, a little roof
    const wa=B()*TAU, wx=Math.cos(wa)*18.5, wz=Math.sin(wa)*18.5;
    const well=new THREE.Group();
    well.add(new THREE.Mesh(latheGeo([[0.85,0],[0.85,0.55],[0.65,0.6],[0.65,0.06]],20),stone));
    for(const sx of [-1,1]){
      const post=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.07,1.6,7),wood);
      post.position.set(sx*0.7,0.8,0); well.add(post);
    }
    const wroof=new THREE.Mesh(gableRoof(1.7,0.5,1.2,0.2),wood);
    wroof.position.y=1.6; well.add(wroof);
    well.position.set(wx,groundY(wx,wz,setId),wz);
    well.traverse(o=>{if(o.isMesh)o.castShadow=true;});
    Bubble.group.add(well);
  }
  if(s.kind!=='village'){
    // market stalls along the plaza rim: posts, an awning, crates
    const nst=s.kind==='capital'?5:2;
    const awnCv=document.createElement('canvas'); awnCv.width=awnCv.height=32;
    const ag=awnCv.getContext('2d');
    const awnHue=[10,35,200,285][rint(B,0,3)];
    ag.fillStyle='#efe6d2'; ag.fillRect(0,0,32,32);
    ag.fillStyle=hslCss(awnHue,0.45,0.5);
    for(let i=0;i<4;i++) ag.fillRect(i*8,0,4,32);
    const awnTex=new THREE.CanvasTexture(awnCv);
    for(let i=0;i<nst;i++){
      const a=(i/nst)*TAU+B()*0.5+2.2;
      const sx=Math.cos(a)*13.6, sz=Math.sin(a)*13.6;
      const st=new THREE.Group();
      for(const px of [-1,1]) for(const pz of [-1,1]){
        const post=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.06,2.0,6),wood);
        post.position.set(px*0.9,1.0,pz*0.7); st.add(post);
      }
      const awning=new THREE.Mesh(new THREE.PlaneGeometry(2.2,1.8),
        new THREE.MeshLambertMaterial({map:awnTex,side:THREE.DoubleSide}));
      awning.rotation.x=-Math.PI/2+0.18; awning.position.y=2.05; st.add(awning);
      const crate=new THREE.Mesh(bevelBox(0.55,0.5,0.55,0.05),wood);
      crate.position.set(0.3*(B()-0.5),0,0.2); st.add(crate);
      st.rotation.y=-a+Math.PI/2;
      st.position.set(sx,groundY(sx,sz,setId)+0.1,sz);
      st.traverse(o=>{if(o.isMesh)o.castShadow=true;});
      Bubble.group.add(st);
    }
  }
  if(s.kind==='capital'&&f){
    // paired banner poles at the south entry of the square
    const tex=new THREE.CanvasTexture(f.symbol);
    for(const sx of [-1,1]){
      const grp=new THREE.Group();
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.09,4.6,8),stone);
      pole.position.y=2.3; grp.add(pole);
      grp.add(new THREE.Mesh(finialGeo(0.11),new THREE.MeshLambertMaterial({color:0xd8b23a,emissive:0x403008})));
      grp.children[1].position.y=4.6;
      const flag=new THREE.Mesh(new THREE.PlaneGeometry(1.15,0.8),
        new THREE.MeshLambertMaterial({map:tex,side:THREE.DoubleSide}));
      flag.position.set(0.62,4.1,0); grp.add(flag);
      grp.position.set(sx*4.2,groundY(sx*4.2,17.5,setId),17.5);
      grp.traverse(o=>{if(o.isMesh)o.castShadow=true;});
      Bubble.group.add(grp);
    }
  }
  if(s.kind==='village'){
    // haystacks in the fields beyond the houses
    const hayG=latheGeo([[0.95,0],[0.8,0.6],[0.4,1.2],[0,1.5]],14);
    const hay=new THREE.InstancedMesh(hayG,new THREE.MeshLambertMaterial({color:0xb89a52}),8);
    const m2=new THREE.Matrix4(),q2=new THREE.Quaternion(),s2=new THREE.Vector3();
    for(let i=0;i<8;i++){
      const a=B()*TAU, r=52+B()*70;
      const x=Math.cos(a)*r, z=Math.sin(a)*r;
      s2.set(0.8+B()*0.7,0.8+B()*0.6,0.8+B()*0.7);
      q2.setFromAxisAngle(v3(0,1,0),B()*TAU);
      m2.compose(v3(x,groundY(x,z,setId),z),q2,s2);
      hay.setMatrixAt(i,m2);
    }
    hay.castShadow=true;
    Bubble.group.add(hay);
  }
}

/* ---------- the choreographer ---------- */
const RITES=['prayer','procession','sermon','funeral','festival','sacrifice','wedding'];
// presentation-layer chance: what the camera happens to see must never
// consume the history stream, or watching would alter the world
const PRES=()=>Math.random();
let ambientRiteAt=0;
function scheduleAmbientRite(){ ambientRiteAt=performance.now()/1000+rrange(PRES,6,16); }
function startRite(kind,opts){
  if(!Bubble.built||!Bubble.faith) return;
  const f=Bubble.faith, rs=f.rite;
  Bubble.rite={kind,t:0,dur:kind==='procession'?26:kind==='festival'?30:18,opts:opts||{}};
  const P=Bubble.people, n=P.length;
  const slots=[];
  if(kind==='prayer'||kind==='sermon'){
    const rows=Math.ceil(Math.sqrt(n*0.8));
    for(let i=0;i<n;i++){
      const r=Math.floor(i/rows),cq=i%rows;
      slots.push([ (cq-rows/2)*1.4+(kind==='sermon'?Math.sin(r)*2:0), -4+r*1.3 ]);
    }
  } else if(kind==='procession'){
    for(let i=0;i<n;i++) slots.push([-20+((i*1.7)%44), 4+Math.floor(i*1.7/44)*2-2 ]);
  } else if(kind==='festival'){
    for(let i=0;i<n;i++){ const a=i/n*TAU*3, r=4+((i*2.3)%9);
      slots.push([Math.cos(a)*r,Math.sin(a)*r+2]); }
    if(!Bubble.bonfire){
      Bubble.bonfireObj=makeFire(1.5,v3(0,groundY(0,2,Bubble.setId)+0.08,2));
      Bubble.bonfire=Bubble.bonfireObj.grp;
      Bubble.bonfireFlame=Bubble.bonfireObj.flames[0];
    }
  } else if(kind==='funeral'){
    for(let i=0;i<n;i++){ const a=(i/n-0.5)*Math.PI*1.4-Math.PI/2, r=4.5+(i%3)*1.4;
      slots.push([10+Math.cos(a)*r,8+Math.sin(a)*r]); }
    // pyre or grave
    if(!Bubble.pyre){
      const py=new THREE.Group();
      const style=f.rite.funeral;
      if(style==='ascent'||style==='release'||style==='descent'){
        Bubble.pyreFire=makeFire(0.85,v3(10,groundY(10,8,Bubble.setId)+0.1,8));
        Bubble.fire=Bubble.pyreFire.flames[0];
      } else {
        const mound=new THREE.Mesh(blobGeo(1.2,2,0.25,Bubble.setId+5),new THREE.MeshLambertMaterial({color:0x6a5a42}));
        mound.scale.y=0.38; mound.position.y=0.15; mound.castShadow=true; py.add(mound);
        const stone=new THREE.Mesh(bevelBox(0.55,1.25,0.2,0.05),new THREE.MeshLambertMaterial({color:0x8a8a86}));
        stone.position.set(0,0,-1); stone.castShadow=true; py.add(stone);
      }
      py.position.set(10,groundY(10,8,Bubble.setId),8);
      Bubble.group.add(py); Bubble.pyre=py;
    }
  } else if(kind==='sacrifice'){
    for(let i=0;i<n;i++){ const a=i/n*TAU, r=3.5+(i%4);
      slots.push([Math.cos(a)*r, -7.5+Math.sin(a)*r*0.6]); }
  } else if(kind==='wedding'){
    for(let i=0;i<n;i++){ const a=(i/n-0.5)*Math.PI-Math.PI/2, r=3.5+(i%4)*1.2;
      slots.push([Math.cos(a)*r,-4+Math.sin(a)*r]); }
  }
  for(let i=0;i<n;i++){
    P[i].tx=slots[i%slots.length][0]+ (Math.random()-0.5)*0.5;
    P[i].tz=slots[i%slots.length][1]+ (Math.random()-0.5)*0.5;
    P[i].inRite=true;
  }
}
function endRite(){
  if(!Bubble.rite) return;
  Bubble.rite=null;
  for(const p of Bubble.people){
    const a=Math.random()*TAU, r=8+Math.random()*46;
    p.tx=Math.cos(a)*r; p.tz=Math.sin(a)*r; p.inRite=false;
  }
  if(Bubble.pyre){ Bubble.group.remove(Bubble.pyre); Bubble.pyre=null; Bubble.fire=null; }
  removeFire(Bubble.pyreFire); Bubble.pyreFire=null;
  removeFire(Bubble.bonfireObj); Bubble.bonfireObj=null;
  Bubble.bonfire=null; Bubble.bonfireFlame=null;
  scheduleAmbientRite();
}
function updateBubble(dtReal){
  if(!Bubble.built) return;
  const now=performance.now()/1000;
  const s=World.settlements[Bubble.setId];
  // ambient rite scheduling at human speeds
  if(!Bubble.rite&&now>ambientRiteAt&&World.speed>=1&&World.speed<=2){
    const f=Bubble.faith;
    if(f){
      const wts={prayer:0.3+f.vector.ritualDensity, procession:f.rite.procession?0.5:0.05,
        sermon:f.rite.preachy?0.5:0.1, funeral:0.18, festival:f.rite.festivalScale*0.8+0.05,
        sacrifice:f.vector.sacrifice>0?0.3:0, wedding:0.14};
      const kind=rweighted(PRES,Object.keys(wts),k=>wts[k]);
      startRite(kind);
      if(PRES()<0.5) emitEvent('rite',5,kind==='festival'?chronFestival(f,s):chronRite(kind,f,s),
        {faithId:f.id,setId:s.id,filter:'all',hold:false});
    }
  }
  if(Bubble.rite){
    Bubble.rite.t+=dtReal;
    if(Bubble.rite.kind==='procession'){
      // the column walks a loop around the square carrying the banner
      for(const p of Bubble.people){
        p.tx+=dtReal*2.4;
        if(p.tx>26){ p.tx=-26; }
      }
    }
    // (flames animate in the shared fire loop below)
    if(Bubble.rite.t>Bubble.rite.dur) endRite();
  }
  // move people
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),sc=new THREE.Vector3();
  const f=Bubble.faith, posture=f?f.rite.posture:'sway';
  for(let i=0;i<Bubble.people.length;i++){
    const p=Bubble.people[i];
    const dx=p.tx-p.x, dz=p.tz-p.z;
    const d=Math.sqrt(dx*dx+dz*dz);
    const spd=p.speed*(p.inRite?2.6:1);   // the summons is answered at a hurry
    if(d>0.3){ p.x+=dx/d*spd*dtReal; p.z+=dz/d*spd*dtReal; p.bow=Math.max(0,p.bow-dtReal*2); }
    else if(!p.inRite&&Math.random()<dtReal*0.15){
      const a=Math.random()*TAU,r=8+Math.random()*46;
      p.tx=Math.cos(a)*r;p.tz=Math.sin(a)*r;
    }
    let bowT=0, yScale=1;
    if(p.inRite&&d<=0.6&&Bubble.rite){
      const k=Bubble.rite.kind;
      if(k==='prayer'||k==='sacrifice'){
        bowT = posture==='prostrate'?0.72:posture==='kneel'?0.45:0.15+Math.sin(now*1.2+p.phase)*0.1;
      } else if(k==='funeral') bowT=0.3;
      else if(k==='festival') yScale=1+Math.sin(now*4+p.phase)*0.08;
      p.bow=lerp(p.bow,bowT,dtReal*2);
    }
    yScale*= (1-p.bow*0.55);
    const walkBob=d>0.3?Math.abs(Math.sin(now*6+p.phase))*0.05:0;
    const idleSway=d<=0.3?Math.sin(now*1.1+p.phase)*0.012:0;
    sc.set(p.k,yScale*p.k,p.k);
    q.setFromAxisAngle(v3(0,1,0),Math.atan2(dx,dz)+idleSway*4);
    m.compose(v3(p.x+idleSway,groundY(p.x,p.z,Bubble.setId)+walkBob,p.z),q,sc);
    Bubble.crowd.setMatrixAt(i,m);
    Bubble.crowdSkin.setMatrixAt(i,m);
  }
  Bubble.crowd.instanceMatrix.needsUpdate=true;
  Bubble.crowdSkin.instanceMatrix.needsUpdate=true;
  // fires breathe and flicker
  if(Bubble.fires) for(const fr of Bubble.fires){
    for(let i=0;i<fr.flames.length;i++){
      const fl=fr.flames[i];
      const wob=1+Math.sin(now*(7+i*2.6)+fr.phase+i)*0.13+Math.sin(now*17+i*2)*0.05;
      const base=(1.15-i*0.3)*fr.k;
      fl.scale.set(base*wob,base*(1.1+i*0.12)*(1+Math.sin(now*(9+i*3)+fr.phase)*0.16),base*wob);
      fl.rotation.y+=dtReal*(i%2?0.8:-0.6);
    }
    fr.light.intensity=fr.k*(1.35+Math.sin(now*11+fr.phase)*0.25+Math.sin(now*23)*0.12);
  }
  // day and night (shares the real-time day phase with the globe)
  const dayFrac=R3.dayPhase;
  const sunH=Math.sin(dayFrac*TAU);
  if(World.speed<=2){
    Bubble.sun.position.set(Math.cos(dayFrac*TAU)*80,Math.max(6,sunH*90),40);
    Bubble.sun.intensity=clamp01(0.25+sunH)*1.15;
    Bubble.amb.intensity=0.2+clamp01(sunH)*0.15;
    Bubble.hemi.intensity=0.3+clamp01(sunH)*0.4;
    Bubble.fill.intensity=0.15+clamp01(sunH)*0.2;
    Bubble.lampMat.opacity=clamp01(-sunH+0.3);
    if(Bubble.winMat) Bubble.winMat.opacity=clamp01(-sunH+0.35)*0.95;
    const dusk=clamp01(1-Math.abs(sunH));
    Bubble.scene.background.setRGB(0.06+clamp01(sunH)*0.32+dusk*0.13,0.07+clamp01(sunH)*0.31,0.10+clamp01(sunH)*0.34);
    Bubble.scene.fog.color.copy(Bubble.scene.background);
  } else {
    Bubble.sun.intensity=1.05; Bubble.amb.intensity=0.25; Bubble.hemi.intensity=0.65;
    Bubble.fill.intensity=0.32; Bubble.lampMat.opacity=0;
    if(Bubble.winMat) Bubble.winMat.opacity=0;
  }
  if(Bubble.idol) Bubble.idol.rotation.y+=dtReal*0.1;
  // cloth: the banner waves from its pole edge
  if(Bubble.banner){
    const pa=Bubble.banner.geometry.attributes.position;
    const base=Bubble.bannerBase;
    for(let i=0;i<pa.count;i++){
      const bx=base[i*3], by=base[i*3+1];
      pa.setZ(i, Math.sin(bx*2.6+by*1.7+now*4.2)*0.11*(bx+0.8));
      pa.setX(i, bx + Math.sin(now*4.2+by)*0.03*(bx+0.8));
    }
    pa.needsUpdate=true;
    Bubble.banner.geometry.computeVertexNormals();
  }
  // birds ride a slow carousel over the sanctuary
  if(Bubble.birds){
    const bp=Bubble.birds.geometry.attributes.position;
    for(let i=0;i<Bubble.nBirds;i++){
      const a=now*0.35+i/Bubble.nBirds*TAU;
      const r=6.5+Math.sin(now*0.5+i*2.1)*2.2;
      bp.setXYZ(i, Math.cos(a)*r, 12+Math.sin(now*1.7+i*1.3)*1.6+Math.sin(i*7)*2, -14+Math.sin(a)*r*0.8);
    }
    bp.needsUpdate=true;
    Bubble.birds.visible=World.speed<=2&&sunHNow()> -0.05;
  }
  // smoke rises from whatever burns
  if(Bubble.smokes){
    const srcs=[];
    if(Bubble.fire&&Bubble.pyre) srcs.push([10,2.2,8]);
    if(Bubble.bonfireFlame&&Bubble.bonfire) srcs.push([0,3,2]);
    for(const src of srcs){
      Bubble._smokeT=(Bubble._smokeT||0)-dtReal;
      if(Bubble._smokeT<=0&&Bubble.smokes.length<34){
        Bubble._smokeT=0.18;
        const ember=Math.random()<0.45;
        const mat=ember
          ? new THREE.SpriteMaterial({map:Bubble.smokeTex,color:0xffb050,transparent:true,opacity:0.9,
              blending:THREE.AdditiveBlending,depthWrite:false})
          : new THREE.SpriteMaterial({map:Bubble.smokeTex,transparent:true,opacity:0.4,depthWrite:false});
        const spr=new THREE.Sprite(mat);
        spr.position.set(src[0]+(Math.random()-0.5)*0.5, src[1], src[2]+(Math.random()-0.5)*0.5);
        spr.scale.setScalar(ember?0.16:0.7);
        Bubble.group.add(spr);
        Bubble.smokes.push({spr,t:0,drift:Math.random()*TAU,ember});
      }
    }
    for(let i=Bubble.smokes.length-1;i>=0;i--){
      const sm=Bubble.smokes[i];
      sm.t+=dtReal;
      sm.spr.position.y+=dtReal*(sm.ember?2.6:1.5);
      sm.spr.position.x+=Math.sin(now*(sm.ember?4:0.8)+sm.drift)*dtReal*(sm.ember?0.6:0.35);
      if(sm.ember){
        sm.spr.material.opacity=Math.max(0,0.9-sm.t*0.75);
      } else {
        sm.spr.scale.setScalar(0.7+sm.t*0.75);
        sm.spr.material.opacity=Math.max(0,0.4-sm.t*0.09);
      }
      if(sm.spr.material.opacity<=0||sm.t>5){
        Bubble.group.remove(sm.spr); sm.spr.material.dispose();
        Bubble.smokes.splice(i,1);
      }
    }
  }
  if(Bubble.moon){
    const ma=(dayFrac+0.5)*TAU;
    Bubble.moon.position.set(Math.cos(ma)*140,Math.max(-30,Math.sin(ma)*120),-90);
    Bubble.moon.material.opacity=clamp01(-sunH+0.55);
    const red=World.omens.find(o=>o.kind==='redmoon');
    Bubble.moon.material.color.setHex(red?0xe86040:0xffffff);
  }
  if(Bubble.god){
    Bubble.god.position.y=groundY(0,-26,Bubble.setId)+Math.sin(now*0.7)*0.8;
    Bubble.god.rotation.y+=dtReal*0.05;
    if(!(World.manifestUntil&&World.year<World.manifestUntil)){ Bubble.group.remove(Bubble.god); Bubble.god=null; }
  }
  // the seasons tint the living ground
  if(Bubble.groundMat){
    const season=((World.year%1)+1)%1;
    const cold=Math.max(0,Math.cos((season-0.875)*TAU));   // deepest in winter
    const cell=World.cells[s.cell];
    const snow=clamp01((cold-0.3)*1.6)*clamp01((12-cell.temp)/18);
    Bubble.groundMat.color.setRGB(1+snow*1.1,1+snow*1.05,1+snow*1.3);
  }
}
/* ============================================================
   Section: the camera rig. One smoothed spring-damper transform
   spanning orbit, continental flight, ground, and the bubble.
   ============================================================ */
const CameraRig={
  mode:'globe',              // globe | bubble | tree
  lat:18, lon:-40, dist:PLANET_R*3.2,
  tLat:18, tLon:-40, tDist:PLANET_R*3.2,
  bYaw:0.6, bPitch:0.5, bDist:60, tbYaw:0.6, tbPitch:0.5, tbDist:60,
  focusSet:-1, follow:null, manualUntil:0, fade:0, fadeDir:0
};
const BUBBLE_ENTER = PLANET_R*0.09;    // altitude threshold
function camAltitude(){ return CameraRig.dist-PLANET_R; }

function updateCamera(dtReal){
  const C=CameraRig;
  const k=1-Math.pow(0.0018,dtReal);   // spring
  if(C.mode==='globe'){
    if(C.follow){ // track a moving front
      const fr=C.follow;
      if(World.year>=fr.t1||!World.fronts.includes(fr)) C.follow=null;
      else{
        const t=clamp01((World.year-fr.t0)/(fr.t1-fr.t0));
        const idx=t*(fr.path.length-1);
        const a=World.cells[fr.path[Math.floor(idx)]];
        const ll=v3ToLatLon(a.p);
        C.tLat=ll.lat; C.tLon=ll.lon;
      }
    }
    C.lat+=(C.tLat-C.lat)*k; C.lon+=angDelta(C.lon,C.tLon)*k; C.dist+=(C.tDist-C.dist)*k;
    C.lat=clamp(C.lat,-88,88);
    const alt=camAltitude();
    const eye=latLonToV3(C.lat,C.lon,C.dist);
    R3.camera.position.copy(eye);
    // tilt toward the horizon as we descend
    const tilt=clamp01(1-(alt-6)/(PLANET_R*0.5));
    const surf=latLonToV3(C.lat,C.lon,PLANET_R);
    const north=v3(0,1,0);
    const look=surf.clone().lerp(v3(0,0,0),1-tilt*0.85);
    R3.camera.up.copy(alt<PLANET_R*0.7?surf.clone().normalize():north);
    R3.camera.lookAt(tilt>0.5?horizonPoint(C):v3(0,0,0));
    // enter bubble
    if(alt<BUBBLE_ENTER&&C.fadeDir===0){
      const c=nearestCell(surf.clone().normalize());
      let sid=c?c.nearSet:-1;
      if(sid<0){ sid=nearestSettlement(surf); }
      if(sid>=0) beginTransition('bubble',sid);
    }
  } else if(C.mode==='bubble'){
    C.bYaw+=(C.tbYaw-C.bYaw)*k; C.bPitch+=(C.tbPitch-C.bPitch)*k; C.bDist+=(C.tbDist-C.bDist)*k;
    C.bPitch=clamp(C.bPitch,0.08,1.35); C.bDist=clamp(C.bDist,7,150);
    const y=Math.sin(C.bPitch)*C.bDist, r=Math.cos(C.bPitch)*C.bDist;
    R3.camera.up.set(0,1,0);
    R3.camera.position.set(Math.cos(C.bYaw)*r, y+2, Math.sin(C.bYaw)*r);
    R3.camera.lookAt(0,2.5,-4);
    if(C.bDist>=149&&C.fadeDir===0) beginTransition('globe',-1);
  }
  // the veil of cloud between worlds: whiteout in fast, clear out slow,
  // with the camera motion continuous through it
  if(C.fadeDir!==0){
    C.fade+=dtReal*(C.fadeDir>0?3.0:-1.5);
    if(C.fade>=1){ C.fade=1; C.fadeDir=-1; applyPendingMode(); }
    if(C.fade<=0){ C.fade=0; C.fadeDir=0; }
  }
}
function horizonPoint(C){
  const surf=latLonToV3(C.lat,C.lon,PLANET_R);
  const n=surf.clone().normalize();
  const east=v3(0,1,0).cross(n).normalize();
  const fwd=n.clone().cross(east).normalize();
  return surf.clone().add(fwd.multiplyScalar(30)).add(n.multiplyScalar(2));
}
function angDelta(a,b){ let d=b-a; while(d>180)d-=360; while(d<-180)d+=360; return d; }
function nearestSettlement(p){
  let best=-1,bd=-2; const n=p.clone().normalize();
  for(const s of World.settlements){ const d=n.dot(World.cells[s.cell].p); if(d>bd){bd=d;best=s.id;} }
  return best;
}
let pendingMode=null;
function beginTransition(mode,sid){
  pendingMode={mode,sid};
  CameraRig.fadeDir=1; CameraRig.fade=Math.max(CameraRig.fade,0.001);
  if(typeof sfx==='function') sfx('whoosh');
}
function applyPendingMode(){
  const C=CameraRig;
  if(!pendingMode) return;
  if(pendingMode.mode==='bubble'){
    enterBubble(pendingMode.sid);
    C.mode='bubble'; C.focusSet=pendingMode.sid;
    // fall out of the cloud, still descending: high and steep, easing to eye level
    C.bDist=110; C.bPitch=1.05; C.bYaw=C.tbYaw=Math.random()*TAU;
    C.tbDist=32; C.tbPitch=0.48;
    showToast(World.settlements[pendingMode.sid].name);
  } else {
    C.mode='globe'; C.focusSet=-1;
    const s=World.settlements[Bubble.setId];
    if(s){ const ll=v3ToLatLon(World.cells[s.cell].p);
      C.lat=C.tLat=ll.lat; C.lon=C.tLon=ll.lon; }
    // rise out of the cloud, still climbing
    C.dist=PLANET_R+BUBBLE_ENTER*1.1;
    C.tDist=PLANET_R+PLANET_R*0.55;
    disposeBubbleContent();
  }
  pendingMode=null;
}
function flyTo(setId,alt){
  const s=World.settlements[setId];
  if(!s) return;
  if(CameraRig.mode==='bubble'&&setId!==CameraRig.focusSet) beginTransition('globe',-1);
  const ll=v3ToLatLon(World.cells[s.cell].p);
  CameraRig.tLat=ll.lat; CameraRig.tLon=ll.lon;
  CameraRig.tDist=PLANET_R+(alt||PLANET_R*0.35);
  CameraRig.follow=null;
}
function flyToEvent(ev){
  if(treeOpen) toggleTree(false);
  let sid=ev.setId;
  if(sid===undefined&&ev.faithId!==undefined){
    const f=World.faiths[ev.faithId];
    if(f){
      if(!f.deadYear){ // fly to the living heart of the faith
        let best=-1,bs=0;
        for(const s of World.settlements){ const sh=(s.pool[f.id]||0)*s.pop; if(sh>bs){bs=sh;best=s.id;} }
        sid=best>=0?best:f.holySiteSet;
      } else sid=f.holySiteSet>=0?f.holySiteSet:f.homeSet;
    }
  }
  if(sid!==undefined&&sid>=0){ flyTo(sid,PLANET_R*0.3); suspendDirector(); }
  if(ev.faithId!==undefined&&World.faiths[ev.faithId]) inspectFaith(World.faiths[ev.faithId]);
}
function suspendDirector(){ CameraRig.manualUntil=performance.now()/1000+30;
  document.body.classList.remove('cine'); }

/* ---------- input ---------- */
function initInput(){
  const el=R3.renderer.domElement;
  let dragging=false,lx=0,ly=0,moved=0,lastHover=0;
  // sound wakes on the first gesture, as the browser requires
  const wake=()=>{ audioInit(); };
  addEventListener('pointerdown',wake,{once:false});
  addEventListener('keydown',wake);
  // any button press clicks
  document.addEventListener('click',e=>{
    if(e.target.closest('button,.chip,.dtab,.actBtn,.fp,.entry,.jump')) sfx('click');
  });
  // hover ring over settlements at globe scale
  addEventListener('pointermove',e=>{
    const now=performance.now();
    if(now-lastHover<90) return;
    lastHover=now;
    if(CameraRig.mode!=='globe'||treeOpen||dragging||!R3.hoverRing){ if(R3.hoverRing) R3.hoverRing.visible=false; return; }
    if(e.target.closest('#hud,#chronicle,#drawer,#inspector,#treeUI,#faithPanel,#miniTree')){ R3.hoverRing.visible=false; return; }
    const mouse=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
    raycaster.setFromCamera(mouse,R3.camera);
    const hit=raycaster.intersectObject(R3.globe)[0];
    if(!hit){ R3.hoverRing.visible=false; document.body.style.cursor=''; return; }
    const sid=nearestSettlement(hit.point);
    const s=World.settlements[sid];
    if(s&&World.cells[s.cell].p.dot(hit.point.clone().normalize())>0.9955){
      placeRingAt(R3.hoverRing,sid,1.7);
      document.body.style.cursor='pointer';
    } else { R3.hoverRing.visible=false; document.body.style.cursor=''; }
  });
  el.addEventListener('pointerdown',e=>{ dragging=true;lx=e.clientX;ly=e.clientY;moved=0; });
  addEventListener('pointerup',e=>{
    dragging=false;
    if(moved<5) handleClick(e);
  });
  addEventListener('pointermove',e=>{
    if(!dragging) return;
    const dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX;ly=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    suspendDirector();
    const C=CameraRig;
    if(C.mode==='globe'){
      const sc=camAltitude()/PLANET_R*0.35;
      C.tLon-=dx*sc; C.tLat+=dy*sc;
      C.tLat=clamp(C.tLat,-88,88);
      C.follow=null;
    } else {
      C.tbYaw+=dx*0.008; C.tbPitch+=dy*0.006;
      C.tbPitch=clamp(C.tbPitch,0.08,1.35);
    }
  });
  el.addEventListener('wheel',e=>{
    e.preventDefault(); suspendDirector();
    const C=CameraRig;
    const f=Math.exp(e.deltaY*0.0012);
    if(C.mode==='globe'){
      C.tDist=clamp(PLANET_R+(C.tDist-PLANET_R)*f,PLANET_R+2,PLANET_R*4);
    } else {
      C.tbDist=clamp(C.tbDist*f,7,150);
    }
  },{passive:false});
  addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT') return;
    if(e.code==='Space'){ e.preventDefault(); setSpeed(World.speed===0?World._lastSpeed||3:0); }
    else if(e.key>='1'&&e.key<='5') setSpeed(+e.key-1);
    else if(e.key==='h'||e.key==='H') document.body.classList.toggle('uihidden');
    else if(e.key==='c'||e.key==='C') toggleWatch();
    else if(e.key==='t'||e.key==='T') toggleTree();
    else if(e.key==='Escape'){ hideInspector(); if(armedAct) armAct(null); if(treeOpen) toggleTree(false); }
  });
}
const raycaster=new THREE.Raycaster();
function handleClick(e){
  if(e.target.closest('#hud,#chronicle,#drawer,#inspector,#treeUI,#faithPanel,#miniTree')) return;
  if(treeOpen){ treeClick(e); return; }
  const mouse=new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(mouse,R3.camera);
  suspendDirector();
  if(CameraRig.mode==='globe'){
    const hit=raycaster.intersectObject(R3.globe)[0];
    if(!hit){ hideInspector(); return; }
    const n=hit.point.clone().normalize();
    if(armedAct){ performAct(armedAct,nearestSettlement(hit.point)); return; }
    // fronts first
    let bestFr=null,bd=8;
    if(R3.frontPts){
      for(const fr of World.fronts){
        const t=clamp01((World.year-fr.t0)/(fr.t1-fr.t0));
        const a=World.cells[fr.path[Math.floor(t*(fr.path.length-1))]];
        const d=a.p.clone().multiplyScalar(PLANET_R).distanceTo(hit.point);
        if(d<bd){bd=d;bestFr=fr;}
      }
    }
    if(bestFr){ CameraRig.follow=bestFr; inspectFront(bestFr); return; }
    const sid=nearestSettlement(hit.point);
    const s=World.settlements[sid];
    if(s&&World.cells[s.cell].p.dot(n)>0.995){ inspectSettlement(s); }
    else { // faith territory
      const c=nearestCell(n);
      if(c&&c.nearSet>=0){
        const dom=dominantFaith(World.settlements[c.nearSet]);
        if(dom!==null&&World.faiths[dom]) inspectFaith(World.faiths[dom]);
        else hideInspector();
      } else hideInspector();
    }
  } else {
    // bubble: click people or temple
    if(armedAct){ performAct(armedAct,Bubble.setId); return; }
    if(Bubble.temple){
      const hit=raycaster.intersectObject(Bubble.temple,true)[0];
      if(hit){ inspectTemple(); return; }
    }
    if(Bubble.crowd){
      const hit=raycaster.intersectObjects([Bubble.crowd,Bubble.crowdSkin].filter(Boolean))[0];
      if(hit&&hit.instanceId!==undefined){ inspectPerson(hit.instanceId); return; }
    }
    hideInspector();
  }
}
/* ============================================================
   Section: the tree of faiths. A braiding dendrogram: branches
   split at schisms and merge at syncretisms. Co-primary view.
   ============================================================ */
let treeOpen=false, treeFilter='all', treeNodes=[];
function toggleTree(force){
  treeOpen=force!==undefined?force:!treeOpen;
  document.getElementById('treeCanvas').style.display=treeOpen?'block':'none';
  document.getElementById('treeUI').style.display=treeOpen?'flex':'none';
  document.getElementById('btnTree').classList.toggle('on',treeOpen);
  if(treeOpen) drawTree();
}
function treeVisible(f){
  if(treeFilter==='living') return !f.deadYear;
  if(treeFilter==='dead') return !!f.deadYear;
  if(treeFilter==='universal') return f.vector.proselytizing>0.55;
  if(treeFilter==='syncretic') return f.syncretic;
  return true;
}
function layoutTree(){
  // lanes by DFS from roots; x is time
  const lanes={}; let lane=0;
  const roots=World.faiths.filter(f=>!f.parentIds.length);
  const seen=new Set();
  function walk(f){
    if(seen.has(f.id)) return; seen.add(f.id);
    lanes[f.id]=lane++;
    const kids=f.childrenIds.map(id=>World.faiths[id]).sort((a,b)=>a.originYear-b.originYear);
    for(const k of kids) if(k.parentIds[0]===f.id) walk(k);
  }
  for(const r of roots) walk(r);
  for(const f of World.faiths) if(lanes[f.id]===undefined) lanes[f.id]=lane++;
  return {lanes,nLanes:lane};
}
function drawTree(target){
  const cv=target||document.getElementById('treeCanvas');
  const mini=!!target;
  if(!mini){ cv.width=innerWidth; cv.height=innerHeight; }
  const g=cv.getContext('2d');
  const W=cv.width,Hh=cv.height;
  g.clearRect(0,0,W,Hh);
  if(!mini){
    g.fillStyle='#0c0906'; g.fillRect(0,0,W,Hh);
    g.fillStyle='#c9a227'; g.font='italic 20px Georgia'; g.textAlign='center';
    g.fillText('The Tree of Faiths of '+World.name, W/2, 36);
    g.font='12px Georgia'; g.fillStyle='#8a7a58';
    g.fillText('branches split at schisms and braid at blendings · click a branch to visit its faith', W/2, 56);
  }
  const {lanes,nLanes}=layoutTree();
  const t0=World.startYear, t1=Math.max(World.year,t0+50);
  const mx=mini?6:90, my=mini?8:86;
  const xOf=y=>mx+(y-t0)/(t1-t0)*(W-2*mx);
  const yOf=l=>my+(l+0.5)/(Math.max(1,nLanes))*(Hh-2*my);
  treeNodes=[];
  // time gridlines
  if(!mini){
    g.strokeStyle='rgba(201,162,39,0.12)'; g.fillStyle='#6a5a3a'; g.font='11px Georgia';
    const step=Math.pow(10,Math.floor(Math.log10((t1-t0)/6)));
    for(let y=Math.ceil(t0/step)*step;y<t1;y+=step){
      g.beginPath();g.moveTo(xOf(y),my-16);g.lineTo(xOf(y),Hh-my+16);g.stroke();
      g.fillText(fmtYear(y),xOf(y)+3,my-20);
    }
  }
  for(const f of World.faiths){
    if(!treeVisible(f)) continue;
    const l=lanes[f.id];
    const x0=xOf(f.originYear), x1=xOf(f.deadYear||World.year), y=yOf(l);
    const w=mini?1.2:clamp(Math.log10(Math.max(10,f.peakAdherents))-1,1,6);
    g.strokeStyle=f.deadYear?hslCss(f.hue,0.3,0.3):f.color;
    g.lineWidth=w; g.lineCap='round';
    // connect to parents (braid)
    for(const pid of f.parentIds){
      const pf=World.faiths[pid];
      if(!pf) continue;
      const py=yOf(lanes[pid]);
      g.beginPath();
      g.moveTo(x0-(mini?4:26),py);
      g.bezierCurveTo(x0-(mini?2:8),py,x0-(mini?2:8),y,x0,y);
      g.lineWidth=Math.max(1,w*0.6);
      g.strokeStyle=f.syncretic?'rgba(230,150,255,0.6)':hslCss(pf.hue,0.4,0.4);
      g.stroke();
    }
    // the branch itself
    g.strokeStyle=f.deadYear?hslCss(f.hue,0.3,0.3):f.color;
    g.lineWidth=w;
    g.beginPath();g.moveTo(x0,y);g.lineTo(x1,y);g.stroke();
    if(f.deadYear){ // a small cross-tick at the last believer
      g.beginPath();g.moveTo(x1,y-4);g.lineTo(x1,y+4);g.stroke();
    }
    if(!mini){
      const len=x1-x0;
      const major=!f.deadYear||f.peakAdherents>totalPop()*0.03;
      if(len>18||major) g.drawImage(f.symbol,x0-9,y-22,18,18);
      if(len>60||major){
        g.fillStyle=f.deadYear?'#7a6a52':'#e8dcb8';
        g.font=(f.adherents>totalPop()*0.2?'13px':'11px')+' Georgia';
        g.textAlign='left';
        g.fillText(f.name,x0+12,y-8);
      }
      treeNodes.push({x0,x1,y,f});
    }
  }
  if(!mini){
    g.fillStyle='#8a7a58';g.font='italic 12px Georgia';g.textAlign='center';
    g.fillText(fmtYear(World.year)+' · '+World.eraName,W/2,Hh-24);
  }
}
function treeClick(e){
  for(const n of treeNodes){
    if(Math.abs(e.clientY-n.y)<14&&e.clientX>n.x0-12&&e.clientX<n.x1+12){
      inspectFaith(n.f);
      toggleTree(false);
      flyToEvent({faithId:n.f.id});
      return;
    }
  }
}
/* ============================================================
   Section: the auto-director. Consumes the event bus, decides
   montage or hold per beat, flies the camera to the story.
   ============================================================ */
const Director={
  active:null, until:0, cooldowns:{}, idlePhase:0, idleAt:0, holdRite:null,
  restoreSpeed:null
};
function directorTick(now,dtReal){
  if(now<CameraRig.manualUntil){ Director.active=null; return; }
  // finish current beat
  if(Director.active&&now>Director.until){
    if(Director.restoreSpeed!==null&&Director.active.kind==='hold'){
      setSpeed(Director.restoreSpeed,true); Director.restoreSpeed=null;
    }
    Director.active=null;
    document.body.classList.remove('cine');
  }
  // pick the best pending beat
  let best=null;
  for(const ev of World.eventBus){
    if(ev.priority<4) continue;
    const cd=Director.cooldowns[ev.cls]||0;
    if(now<cd) continue;
    if(!best||ev.priority>best.priority) best=ev;
  }
  World.eventBus.length=0;
  if(best&&(!Director.active||best.priority>Director.active.priority)){
    startBeat(best,now);
    return;
  }
  if(Director.active){
    runBeat(Director.active,now,dtReal);
    return;
  }
  // at human speeds, an idle director stages sacred life itself
  if(World.speed>=1&&World.speed<=2){
    if(!Director.nextAmbient) Director.nextAmbient=now+14;
    if(now>Director.nextAmbient){
      Director.nextAmbient=now+rrange(PRES,26,48);
      const cands=World.settlements.filter(s=>dominantFaith(s)!==null&&s.pop>800);
      if(cands.length){
        const s=rpick(PRES,cands);
        const f=World.faiths[dominantFaith(s)];
        const kind=rweighted(PRES,['prayer','festival','funeral','sermon','procession'],
          k=>k==='festival'?f.rite.festivalScale+0.1:k==='procession'?(f.rite.procession?0.5:0.05):0.3);
        emitEvent('rite',6,kind==='festival'?chronFestival(f,s):chronRite(kind,f,s),
          {faithId:f.id,setId:s.id,filter:'all',hold:true});
        return;
      }
    }
  }
  // idle: golden-hour drift between holy cities
  if(now>Director.idleAt){
    Director.idleAt=now+rrange(PRES,14,26);
    const sites=World.settlements.filter(s=>s.holySite);
    const s=sites.length?rpick(PRES,sites):rpick(PRES,World.settlements);
    if(CameraRig.mode==='bubble'&&PRES()<0.6){
      CameraRig.tbYaw+=rrange(PRES,-1.2,1.2); CameraRig.tbDist=rrange(PRES,18,50);
    } else {
      if(CameraRig.mode==='bubble') beginTransition('globe',-1);
      flyTo(s.id,rrange(PRES,PLANET_R*0.25,PLANET_R*1.2));
    }
  } else if(CameraRig.mode==='globe'&&!CameraRig.follow){
    CameraRig.tLon+=dtReal*1.2;   // slow stately rotation
  }
}
function startBeat(ev,now){
  const dur=ev.hold?rrange(PRES,14,24):rrange(PRES,9,17);
  Director.cooldowns[ev.cls]=now+48;
  if(ev.hold){ document.body.classList.add('cine'); sfx('bell'); }
  Director.active={ev,priority:ev.priority,kind:ev.hold?'hold':'montage',started:now};
  Director.until=now+dur;
  showBeatCard(ev);
  if(ev.hold&&ev.setId!==undefined&&ev.setId>=0){
    // human-time hold: descend into the place and stage the moment
    flyTo(ev.setId,BUBBLE_ENTER*0.8);
    if(World.speed>2){ Director.restoreSpeed=World.speed; setSpeed(1,true); }
    Director.holdRite=holdRiteFor(ev.cls);
    Director.holdSet=ev.setId;
    Director.holdStaged=false;
  } else {
    // deep-time montage: pull up and drift across the affected ground
    if(CameraRig.mode==='bubble') beginTransition('globe',-1);
    if(ev.setId!==undefined&&ev.setId>=0) flyTo(ev.setId,rrange(PRES,PLANET_R*0.7,PLANET_R*1.6));
    else if(ev.faithId!==undefined) flyToEventQuiet(ev);
    if(ev.wantsMontage&&PRES()<0.35&&!treeOpen){ toggleTree(true); Director.treeShown=true;
      setTimeout(()=>{ if(Director.treeShown){ toggleTree(false); Director.treeShown=false; } },6000); }
  }
}
function flyToEventQuiet(ev){
  const f=World.faiths[ev.faithId];
  if(!f) return;
  let best=-1,bs=0;
  for(const s of World.settlements){ const sh=(s.pool[f.id]||0)*s.pop; if(sh>bs){bs=sh;best=s.id;} }
  if(best>=0) flyTo(best,PLANET_R*0.8);
}
function runBeat(b,now,dtReal){
  if(b.kind==='hold'){
    // once we are inside the bubble at the right place, stage the rite
    if(CameraRig.mode==='bubble'&&CameraRig.focusSet===Director.holdSet&&!Director.holdStaged){
      Director.holdStaged=true;
      if(Director.holdRite) startRite(Director.holdRite);
      CameraRig.tbDist=rrange(PRES,16,26);
      CameraRig.tbPitch=rrange(PRES,0.25,0.5);
    }
    if(Director.holdStaged) CameraRig.tbYaw+=dtReal*0.12; // slow orbit of the moment
  } else {
    if(CameraRig.mode==='globe'&&!CameraRig.follow) CameraRig.tLon+=dtReal*2.5;
  }
}
function holdRiteFor(cls){
  const m={martyr:'sacrifice',persecution:'sermon',founding:'sermon',rite:null,
    festival:'festival',miracle:'prayer',manifest:'prayer',rulerConv:'procession',
    iconoclasm:'procession',scripture:'sermon'};
  return m[cls]!==undefined?m[cls]:'prayer';
}

/* ---------- Acts ---------- */
const ACTS=[
  ['prophet','Raise a prophet',true],['schism','Sow a schism',true],['blend','Blend two faiths',false],
  ['persecute','Loose a persecution',true],['holywar','Declare a holy war',false],['convert','Convert a ruler',false],
  ['scripture','Canonize a scripture',false],['martyr','Martyr a figure',true],['sign','Reveal a sign',false],
  ['miracle','Reveal a miracle (literal)',false],['pest','Send a pestilence',true],['golden','Grant a golden age',true],
  ['disench','Spark a disenchantment',true],['found','Found a faith',true],['raze','Raze a holy site',true]
];
let armedAct=null;
function buildActsTab(){
  const el=document.getElementById('dsec-acts');
  let html='<div class="dnote">The acts of a fate presiding over history. Acts marked with a hand ask you to click a place on the world.</div>';
  for(const [k,label,place] of ACTS)
    html+=`<button class="actBtn" data-act="${k}">${place?'☞ ':''}${label}</button>`;
  el.innerHTML=html;
  el.querySelectorAll('.actBtn').forEach(b=>b.onclick=()=>{
    const k=b.dataset.act;
    const def=ACTS.find(a=>a[0]===k);
    if(def[2]) armAct(armedAct===k?null:k);
    else { performAct(k,-1); armAct(null); }
  });
}
function armAct(k){
  armedAct=k;
  document.querySelectorAll('.actBtn').forEach(b=>b.classList.toggle('armed',b.dataset.act===k));
  if(k) showToast('Choose a place upon the world');
}
function performAct(kind,setId){
  const H=RNG.H;
  const s=setId>=0?World.settlements[setId]:rpick(H,World.settlements);
  armAct(null);
  if(s&&CameraRig.mode==='globe') spawnPing(s.id);
  sfx('click');
  switch(kind){
    case 'prophet': spawnProphet(s,H,true); break;
    case 'found': {
      const fig=makeFigure(H,'prophet',-1,s.id);
      const f=makeFaith(H,{vector:newVector(H),culture:s.culture,homeSet:s.id,founder:fig.id});
      fig.faithId=f.id; f.founderName=fig.name;
      s.pool[f.id]=(s.pool[f.id]||0)+0.4;
      emitEvent('founding',9,chronFounding(fig,f,s),{faithId:f.id,setId:s.id,filter:'found',hold:true});
      break; }
    case 'schism': {
      const dom=dominantFaith(s);
      if(dom!==null&&World.faiths[dom]){
        World.faiths[dom].lastSchism=-999;
        if(!fireSchism(World.faiths[dom],s,H,'isolation')) showToast('The faith here is too young or too small to split');
      }
      else showToast('No faith holds this place'); break; }
    case 'blend': {
      for(const st of World.settlements){
        const es=Object.entries(st.pool).filter(([k,v])=>v>0.2&&World.faiths[k]&&!World.faiths[k].deadYear);
        if(es.length>=2){ fireSyncretism(World.faiths[es[0][0]],World.faiths[es[1][0]],st,H); return; }
      }
      showToast('No two faiths share ground closely enough'); break; }
    case 'persecute': {
      const civ=World.civs[s.culture];
      const sf=World.faiths[civ.stateFaith];
      const minority=Object.entries(s.pool).filter(([k,v])=>+k!==civ.stateFaith&&v>0.05&&World.faiths[k]&&!World.faiths[k].deadYear);
      if(sf&&minority.length) firePersecution(civ,sf,World.faiths[rpick(H,minority)[0]],s,H);
      else showToast('No minority to persecute here'); break; }
    case 'holywar': {
      const pairs=[];
      for(const a of World.civs) for(const b of World.civs){
        if(a.id>=b.id||a.warWith>=0||b.warWith>=0) continue;
        const fa=World.faiths[a.stateFaith],fb=World.faiths[b.stateFaith];
        if(fa&&fb&&!fa.deadYear&&!fb.deadYear&&fa.id!==fb.id) pairs.push([a,b,fa,fb]);
      }
      if(pairs.length){ const [a,b,fa,fb]=rpick(H,pairs);
        a.warWith=b.id;b.warWith=a.id;a.warEnd=b.warEnd=World.year+rrange(H,5,15);a.holyWar=b.holyWar=true;
        World.holyWarActive=true;
        emitEvent('holywar',8,chronHolyWar(a,b,fa,fb),{faithId:fa.id,filter:'war',wantsMontage:true});
        addFront('army',a.stateFaith,World.cultures[a.culture].capital,World.cultures[b.culture].capital);
      } else showToast('No two thrones free to fight'); break; }
    case 'convert': {
      const civ=rpick(H,World.civs);
      const cap=World.settlements[World.cultures[civ.culture].capital];
      const others=livingFaiths().filter(f=>f.id!==civ.stateFaith);
      if(others.length&&civ.ruler!==null){
        const f=rpick(H,others);
        civ.stateFaith=f.id; World.figures[civ.ruler].faithId=f.id;
        emitEvent('rulerConv',7,chronRulerConv(World.figures[civ.ruler],civ,f,cap),{faithId:f.id,setId:cap.id,filter:'war',wantsMontage:true});
      } break; }
    case 'scripture': {
      const oral=livingFaiths().filter(f=>!f.scripture);
      if(oral.length) spawnTheologian(rpick(H,oral.filter(f=>f.adherents>500).length?oral.filter(f=>f.adherents>500):oral),H);
      else showToast('Every living faith already has its book'); break; }
    case 'martyr': {
      const dom=dominantFaith(s);
      const minority=Object.entries(s.pool).filter(([k])=>+k!==dom&&World.faiths[k]&&!World.faiths[k].deadYear);
      const fid=minority.length?+rpick(H,minority)[0]:dom;
      if(fid===null) break;
      const target=World.faiths[fid];
      const fig=makeFigure(H,'martyr',fid,s.id); fig.alive=false;
      target.martyrGlow=Math.min(0.9,target.martyrGlow+0.35);
      emitEvent('martyr',9,chronMartyr(fig,target,World.faiths[dom]||target,s),{faithId:fid,setId:s.id,filter:'war',hold:true});
      break; }
    case 'sign': {
      const kind=rpick(H,['comet','eclipse','redmoon']);
      World.omens.push({kind,year:World.year,until:World.year+3});
      emitEvent('omen',5,chronOmen(kind),{filter:'sign'});
      break; }
    case 'miracle': {
      if(World.rates.literalism<2){ showToast('Miracles require the Literal dial'); break; }
      const f=rpick(H,livingFaiths());
      const st=World.settlements[f.holySiteSet>=0?f.holySiteSet:0];
      f.martyrGlow=Math.min(0.9,f.martyrGlow+0.5);
      emitEvent('miracle',9,chronMiracle(f,st,'comet'),{faithId:f.id,setId:st.id,filter:'sign',hold:true});
      break; }
    case 'pest': startUpheaval('pestilence',s,H); break;
    case 'golden': {
      const u={kind:'golden',sets:new Set([s.id]),age:0,startYear:World.year,done:false,focus:s.id};
      for(const e of (World.roadAdj[s.id]||[])) u.sets.add(e.to);
      World.upheavals.push(u);
      showToast('A golden age settles on '+s.name);
      break; }
    case 'disench': {
      s.literacy=clamp01(s.literacy+0.4); s.prosperity=clamp01(s.prosperity+0.3);
      for(const e of (World.roadAdj[s.id]||[])){
        World.settlements[e.to].literacy=clamp01(World.settlements[e.to].literacy+0.3);
        World.settlements[e.to].prosperity=clamp01(World.settlements[e.to].prosperity+0.2);
      }
      showToast('Letters and comfort spread around '+s.name);
      break; }
    case 'raze': {
      const site=s.holySite?s:World.settlements.find(x=>x.holySite);
      if(site) razeHolySite(site,World.faiths[dominantFaith(site)]||livingFaiths()[0],H);
      else showToast('No holy site stands there'); break; }
  }
  refreshOverlay();
}

/* ---------- HUD refresh ---------- */
function updateHUD(){
  document.getElementById('hudDate').textContent=fmtYear(World.year);
  document.getElementById('hudEra').textContent=World.eraName;
  const seasonIdx=Math.floor(((World.year%1)+1)%1*4);
  const live=livingFaiths();
  let holy='';
  if(World.speed<=2){
    // a holy-day glyph when any large faith's calendar is in festival season
    for(const f of live){
      if(f.vector.sacredCalendar>0.45&&f.adherents>1000){
        const phase=(World.year+f.id*0.37)%1;
        if(phase<0.06){ holy=' · ✦ holy days of '+f.coreName; break; }
      }
    }
    document.getElementById('hudSeason').textContent=['❀ spring','☀ summer','⚘ autumn','❄ winter'][seasonIdx]+holy;
  } else document.getElementById('hudSeason').textContent='';
  const dom=live.slice().sort((a,b)=>b.adherents-a.adherents)[0];
  const stats=document.getElementById('hudStats');
  stats.innerHTML=(dom?`<img src="${dom.symbolURL}" title="${dom.name}">`:'')
    +`<span>${live.length} living faiths</span><span>${fmtNum(totalPop())} souls</span>`;
  // faith legend
  const fp=document.getElementById('faithPanel');
  const top=live.slice().sort((a,b)=>b.adherents-a.adherents).slice(0,7);
  const tp=totalPop();
  fp.innerHTML=top.map(f=>`<div class="fp" data-fid="${f.id}"><img src="${f.symbolURL}">
    <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${f.name}</span>
    <span class="bar" style="width:${Math.max(2,f.adherents/tp*60)}px;background:${f.color}"></span></div>`).join('');
  fp.querySelectorAll('.fp').forEach(d=>d.onclick=()=>inspectFaith(World.faiths[+d.dataset.fid]));
}

function notableRows(s){
  // HEARTH notables: deterministic per settlement and generation
  const gen=Math.floor(World.year/70);
  const N=makeStream(World.seed,'notables'+s.id+'g'+gen);
  const ph=World.cultures[s.culture].ph;
  const dom=dominantFaith(s);
  const f=dom!==null?World.faiths[dom]:null;
  const roles=[f?(CLERGY[f.vector.clergy]||'elder').replace(/s$/,'').replace(/^a /,''):'elder',
    rpick(N,['reeve','elder','master of the '+rpick(N,['granary','mill','wharf','forge'])])];
  let html='';
  for(const r of roles){
    html+=`<div class="krow"><span>${r.charAt(0).toUpperCase()+r.slice(1)}</span><span>${makeName(ph,2,3,N)}, ${rpick(N,TRAITS)}</span></div>`;
  }
  return html;
}
function bar(v){ const n=Math.round(clamp01(v)*8);
  return '<span style="letter-spacing:1px">'+'▮'.repeat(n)+'<span style="opacity:0.25">'+'▮'.repeat(8-n)+'</span></span>'; }
function condLine(s){
  const parts=[];
  if(s.cond.pestilence>0.15) parts.push('pestilence');
  if(s.cond.famine>0.15) parts.push('famine');
  if(s.cond.war>0.15) parts.push('war');
  if(s.cond.oppression>0.15) parts.push('oppression');
  return parts.length?`<div style="margin-top:4px;color:#8a2318">Under ${parts.join(', ')}.</div>`:'';
}

  document.getElementById('inspBody').innerHTML=f?`
    <div class="krow"><span>Holds to</span><span class="jump" data-fid="${f.id}">${f.name}</span></div>
    <div class="krow"><span>Hopes for</span><span>${AFTERLIFE[f.vector.afterlife]}</span></div>`:
    '<div>Keeps no faith that the record can name.</div>';
  document.getElementById('inspBody').querySelectorAll('.jump[data-fid]').forEach(j=>j.onclick=()=>inspectFaith(World.faiths[+j.dataset.fid]));
}
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.opacity=0,2600);
}
/* ============================================================
   Section: sound. Entirely synthesized (no assets): wind by
   altitude, crowd murmur, fire crackle, bells, era drones,
   chronicle chimes, the whoosh of descent. Starts on the first
   gesture, as browsers require; the note button silences all.
   ============================================================ */
const AudioSys={ctx:null,on:true,lastChime:0,lastCrackle:0};
function audioInit(){
  if(AudioSys.ctx) { if(AudioSys.ctx.state==='suspended') AudioSys.ctx.resume(); return; }
  try{ AudioSys.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const ctx=AudioSys.ctx;
  AudioSys.master=ctx.createGain(); AudioSys.master.gain.value=0.55;
  AudioSys.master.connect(ctx.destination);
  const nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  AudioSys.noiseBuf=nb;
  // wind: looped noise through a slow-breathing lowpass
  const wind=ctx.createBufferSource(); wind.buffer=nb; wind.loop=true;
  AudioSys.windFilter=ctx.createBiquadFilter();
  AudioSys.windFilter.type='lowpass'; AudioSys.windFilter.frequency.value=360; AudioSys.windFilter.Q.value=0.4;
  AudioSys.windGain=ctx.createGain(); AudioSys.windGain.gain.value=0;
  wind.connect(AudioSys.windFilter); AudioSys.windFilter.connect(AudioSys.windGain);
  AudioSys.windGain.connect(AudioSys.master); wind.start();
  // murmur: slowed noise through a voice-band filter
  const mur=ctx.createBufferSource(); mur.buffer=nb; mur.loop=true; mur.playbackRate.value=0.22;
  const mf=ctx.createBiquadFilter(); mf.type='bandpass'; mf.frequency.value=240; mf.Q.value=0.7;
  AudioSys.murGain=ctx.createGain(); AudioSys.murGain.gain.value=0;
  mur.connect(mf); mf.connect(AudioSys.murGain); AudioSys.murGain.connect(AudioSys.master); mur.start();
}
function audioAmbient(){
  if(!AudioSys.ctx||AudioSys.ctx.state!=='running') return;
  const t=AudioSys.ctx.currentTime;
  let wind=0, mur=0;
  if(typeof CameraRig!=='undefined'){
    if(CameraRig.mode==='globe'){
      wind=0.05+clamp01(camAltitude()/(PLANET_R*2.5))*0.11;
    } else {
      wind=0.035;
      mur=clamp01((Bubble.nPeople||0)/150)*(Bubble.rite?0.11:0.055);
    }
  }
  if(!AudioSys.on){ wind=0; mur=0; }
  AudioSys.windGain.gain.setTargetAtTime(wind,t,0.5);
  AudioSys.murGain.gain.setTargetAtTime(mur,t,0.7);
  AudioSys.windFilter.frequency.setTargetAtTime(320+Math.sin(performance.now()/2700)*150,t,0.6);
  // fire crackle: sparse filtered ticks while flames burn nearby
  if(AudioSys.on&&CameraRig.mode==='bubble'&&Bubble.fires&&Bubble.fires.length){
    const now=performance.now();
    if(now-AudioSys.lastCrackle>90+Math.random()*260){
      AudioSys.lastCrackle=now;
      sfx('crackle');
    }
  }
}
function sfx(kind){
  if(!AudioSys.ctx||!AudioSys.on||AudioSys.ctx.state!=='running') return;
  const ctx=AudioSys.ctx, t=ctx.currentTime;
  const out=ctx.createGain(); out.connect(AudioSys.master);
  const tone=(freq,type,gain,att,dec,when)=>{
    const o=ctx.createOscillator(); o.type=type||'sine'; o.frequency.value=freq;
    const g=ctx.createGain(); g.gain.setValueAtTime(0,t+(when||0));
    g.gain.linearRampToValueAtTime(gain,t+(when||0)+(att||0.005));
    g.gain.exponentialRampToValueAtTime(0.0001,t+(when||0)+(att||0.005)+dec);
    o.connect(g); g.connect(out);
    o.start(t+(when||0)); o.stop(t+(when||0)+att+dec+0.1);
  };
  const noise=(gain,dur,f0,f1,type)=>{
    const src=ctx.createBufferSource(); src.buffer=AudioSys.noiseBuf;
    const flt=ctx.createBiquadFilter(); flt.type=type||'bandpass'; flt.Q.value=1.1;
    flt.frequency.setValueAtTime(f0,t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+dur*0.25);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(flt); flt.connect(g); g.connect(out);
    src.start(t); src.stop(t+dur+0.1);
  };
  switch(kind){
    case 'click': tone(720,'triangle',0.045,0.003,0.05); break;
    case 'chime': tone(1318,'sine',0.035,0.004,0.7); tone(1976,'sine',0.02,0.004,0.5,0.02); break;
    case 'bell': {
      const f=196+Math.random()*60;
      tone(f,'sine',0.11,0.004,2.6);
      tone(f*2.0,'sine',0.07,0.004,1.9);
      tone(f*2.94,'sine',0.045,0.004,1.3);
      tone(f*4.4,'sine',0.02,0.004,0.8);
      break; }
    case 'drone': {
      tone(65.4,'sine',0.07,2.2,5.5);
      tone(65.9,'sine',0.05,2.6,5.0);
      tone(98,'sine',0.03,3.0,4.5);
      break; }
    case 'whoosh': noise(0.16,0.9,240,1400); break;
    case 'crackle': noise(0.02+Math.random()*0.02,0.05+Math.random()*0.06,1800+Math.random()*1600,900,'highpass'); break;
    case 'ping': tone(880,'sine',0.04,0.003,0.35); break;
  }
}
function toggleAudio(){
  AudioSys.on=!AudioSys.on;
  const b=document.getElementById('btnAudio');
  if(b) b.classList.toggle('on',AudioSys.on);
  if(AudioSys.on){ audioInit(); }
}
/* ============================================================
   Section: main. Boot, loop, title.
   ============================================================ */
function getSeed(){
  const m=location.hash.match(/#s=([^&]+)/);
  if(m) return decodeURIComponent(m[1]);
  const s=String(Math.floor(Math.random()*1e7));
  try{ history.replaceState(null,'','#s='+s); }catch(e){}
  return s;
}
let lastFrame=0, fpsAcc=0, fpsN=0, lastOverlayAt=0, lastHudAt=0, lastMiniAt=0;
function boot(){
  const seed=getSeed();
  const lines=['settling the world…','raising the mountains…','seeding the peoples…','laying the roads…','kindling the first shrines…'];
  let li=0;
  const loadLine=document.getElementById('loadLine');
  const stepLoad=()=>{ if(li<lines.length){ loadLine.textContent=lines[li++]; setTimeout(stepLoad,90); } };
  stepLoad();
  setTimeout(()=>{
    try{
    genWorld(seed);
    document.title='The Creeds of '+World.name;
    initRenderer();
    initInput();
    initUI();
    // a settled start: the primal faiths have had their first quiet centuries
    emitEvent('era',5,null,{era:World.eraName});
    emitEvent('open',5,`Here begins the record of ${World.name}, reconstructed from scripture, inscription, ruin, and the residue of borrowed doctrine. In the beginning each people kept the faith of its own valley, and the valleys had not yet spoken to one another.`,{filter:'all'});
    document.getElementById('loading').style.display='none';
    beginIntro();
    requestAnimationFrame(frame);
    }catch(err){
      document.getElementById('loadLine').textContent=
        'This world could not be settled here ('+err.message+'). CREED needs a browser with WebGL.';
      console.error(err);
    }
  },500);
}
/* ---------- the opening: the world resolves, the title is set down ---------- */
let introActive=false, introEndsAt=0;
function beginIntro(){
  introActive=true;
  document.body.classList.add('intro');
  document.getElementById('introTitle').textContent='The Creeds of '+World.name;
  document.getElementById('introSub').textContent=fmtYear(World.year)+' · '+World.eraName;
  CameraRig.dist=PLANET_R*5.6; CameraRig.tDist=PLANET_R*2.4;
  CameraRig.manualUntil=performance.now()/1000+9.5;
  introEndsAt=performance.now()/1000+8.5;
  const skip=()=>{ endIntro(); removeEventListener('pointerdown',skip); removeEventListener('keydown',skip); };
  setTimeout(()=>{ addEventListener('pointerdown',skip); addEventListener('keydown',skip); },700);
}
function endIntro(){
  if(!introActive) return;
  introActive=false;
  document.body.classList.remove('intro');
  CameraRig.manualUntil=0;
}
function frame(t){
  requestAnimationFrame(frame);
  const now=t/1000;
  const rawDt=Math.min(0.6,now-(lastFrame||now));   // history keeps pace on slow machines
  let dt=Math.min(0.1,rawDt);                        // choreography stays stable
  lastFrame=now;
  // sim
  simAdvance(rawDt);
  // camera & director
  if(introActive){
    CameraRig.tLon+=dt*2.2;   // the world turns beneath the title
    if(now>introEndsAt) endIntro();
  }
  directorTick(now,dt);
  updateCamera(dt);
  // world visuals
  const isGlobe=CameraRig.mode==='globe';
  if(isGlobe){
    if(now-lastOverlayAt>0.8){ lastOverlayAt=now; refreshOverlay(); }
    updateFronts();
    updateSky(dt);
    // the territory tint yields to the terrain as you descend
    R3.ovMesh.material.opacity=0.42*clamp01((camAltitude()-PLANET_R*0.12)/(PLANET_R*0.25));
  } else { R3.dayPhase=(R3.dayPhase+dt*dayRate())%1; updateBubble(dt); }
  // render through the cloud veil
  document.getElementById('whiteout').style.opacity=CameraRig.fade;
  if(isGlobe) updatePings(dt);
  audioAmbient();
  R3.renderer.render(isGlobe?R3.scene:Bubble.scene,R3.camera);
  drawLabels(camAltitude());
  if(now-lastHudAt>0.5){ lastHudAt=now; updateHUD(); }
  if(treeOpen&&now-lastMiniAt>1.5){ lastMiniAt=now; drawTree(); }
  else if(!treeOpen&&now-lastMiniAt>3){ lastMiniAt=now;
    const mt=document.getElementById('miniTree');
    if(mt.style.display!=='none'&&insp().style.display!=='block') drawTree(mt);
  }
  // graceful degradation: drop pixel ratio if the frame is heavy
  fpsAcc+=dt; fpsN++;
  if(fpsN>=120){
    const avg=fpsAcc/fpsN;
    if(avg>1/42&&R3.renderer.getPixelRatio()>1) R3.renderer.setPixelRatio(1);
    fpsAcc=0;fpsN=0;
  }
}
boot();
</script>
