  if(H()<0.55){ // successful reform: the faith is pulled back toward rigor
    f.vector.asceticism=clamp01(f.vector.asceticism+0.2);
    f.vector.orthodoxy=clamp01(f.vector.orthodoxy+0.2);
    f.worldly=0; f.disgraced=Math.max(0,f.disgraced-0.3);
    emitEvent('reform',6,chronReform(fig,f,s,true),{faithId:f.id,setId:s.id,filter:'schism'});
  } else { // the reform becomes a schism: a new branch claiming to be the old trunk
    const child=fireSchism(f,s,H,'reform',fig);
    if(child){
      child.name='the Reformed '+(f.coreName)+' Way';
      child.vector.orthodoxy=clamp01(child.vector.orthodoxy+0.25);
    }
  }
}
function spawnTheologian(f,H){
  const home=World.settlements.filter(s=>(s.pool[f.id]||0)>0.3&&s.literacy>0.12);
  if(!home.length) return;
  const s=rpick(H,home);
  const fig=makeFigure(H,'theologian',f.id,s.id);
  f.vector.textuality=clamp01(f.vector.textuality+rrange(H,0.25,0.45));
  f.vector.orthodoxy=clamp01(f.vector.orthodoxy+0.12);
  if(!f.scripture){
    f.scripture=rpick(H,SCRIPT_FORMS)(f.coreName);
    if(!World.firstScriptureYear) World.firstScriptureYear=World.year;
    emitEvent('scripture',7,chronScripture(fig,f,s),{faithId:f.id,setId:s.id,filter:'found',wantsMontage:false});
  }
  f.plate=null;
}
function spawnMissionary(f,H){
  const homes=World.settlements.filter(s=>(s.pool[f.id]||0)>0.4);
  if(!homes.length) return;
  const s=rpick(H,homes);
  const targets=(World.roadAdj[s.id]||[]).map(e=>World.settlements[e.to]).filter(t=>(t.pool[f.id]||0)<0.2);
  if(!targets.length) return;
  const t=rpick(H,targets);
  const fig=makeFigure(H,'missionary',f.id,s.id);
  (f.missionBoost=f.missionBoost||{})[t.id]=World.year+rrange(H,10,25);
  addFront('mission',f.id,s.id,t.id);
  if(f.adherents>5000&&H()<0.4)
    emitEvent('mission',5,chronMission(fig,f,s,t),{faithId:f.id,setId:t.id,filter:'war'});
}

/* ---------- politics & war (HEARTH, faith-inflected) ---------- */
function politicsTick(dt,H){
  for(const civ of World.civs){
    const cap=World.settlements[World.cultures[civ.culture].capital];
    if(!cap) continue;
    // rulers rise and pass
    if(!civ.ruler || !World.figures[civ.ruler].alive){
      const fig=makeFigure(H,'ruler',dominantFaith(cap)??-1,cap.id);
      civ.ruler=fig.id; civ.rulerSince=World.year;
      civ.stateFaith = H()<0.8 ? (dominantFaith(cap)??-1) : civ.stateFaith;
    }
    const ruler=World.figures[civ.ruler];
    // elite conversion: a ruler may adopt a rising faith (a lever that pulls a society)
    if(H()<0.006*dt*World.rates.statePower){
      const rising=livingFaiths().filter(f=>(cap.pool[f.id]||0)>0.15&&f.id!==civ.stateFaith&&f.vector.proselytizing>0.4);
      if(rising.length){
        const f=rpick(H,rising);
        civ.stateFaith=f.id; ruler.faithId=f.id;
        emitEvent('rulerConv',7,chronRulerConv(ruler,civ,f,cap),{faithId:f.id,setId:cap.id,filter:'war',wantsMontage:true});
      }
    }
    // legitimacy under divine mandate
    const sf=World.faiths[civ.stateFaith];
    const domCap=dominantFaith(cap);
    civ.legitimacy=clamp01(civ.legitimacy + (sf&&domCap===civ.stateFaith?0.01:-0.012)*dt
      - cap.cond.famine*0.02*dt - (sf&&sf.disgraced>0.3?0.02:0)*dt);
    // a mandate can be lost: the crown falls when heaven withdraws its hand
    if(civ.legitimacy<0.18&&H()<0.2*dt){
      const old=World.figures[civ.ruler];
      old.alive=false;
      const fig=makeFigure(H,'ruler',domCap??-1,cap.id);
      civ.ruler=fig.id; civ.rulerSince=World.year; civ.legitimacy=0.55;
      const flipped=domCap!==null&&domCap!==civ.stateFaith;
      if(flipped) civ.stateFaith=domCap;
      cap.unrest=clamp01(cap.unrest+0.3);
      emitEvent('deposed',6,chronDeposed(old,fig,civ,sf,flipped?World.faiths[domCap]:null),
        {setId:cap.id,filter:'war'});
    }
    // persecution: an exclusive state faith moves against minorities
    if(sf && !sf.deadYear && sf.vector.exclusivity>0.62/Math.max(0.4,World.rates.tolerance) && H()<0.01*dt*World.rates.statePower){
      const minority=Object.entries(cap.pool).filter(([k,v])=>+k!==civ.stateFaith&&v>0.12&&World.faiths[k]&&!World.faiths[k].deadYear);
      if(minority.length){
        const target=World.faiths[rpick(H,minority)[0]];
        firePersecution(civ,sf,target,cap,H);
      }
    }
    // war
    if(civ.warWith<0 && H()<0.0022*dt*World.rates.upheaval){
      const others=World.civs.filter(o=>o!==civ&&o.warWith<0);
      if(others.length){
        const o=rweighted(H,others,x=>{
          const a=World.faiths[civ.stateFaith],b=World.faiths[x.stateFaith];
          return 0.3+(a&&b&&!a.deadYear&&!b.deadYear?conflictPotential(a,b):0);
        });
        const a=World.faiths[civ.stateFaith],b=World.faiths[o.stateFaith];
        const holy=a&&b&&!a.deadYear&&!b.deadYear&&conflictPotential(a,b)>0.55;
        civ.warWith=o.id;o.warWith=civ.id;
        civ.warEnd=o.warEnd=World.year+rrange(H,4,15);
        civ.holyWar=o.holyWar=holy;
        if(holy){ World.holyWarActive=true;
          emitEvent('holywar',8,chronHolyWar(civ,o,a,b),{faithId:a.id,filter:'war',wantsMontage:true});
        } else emitEvent('war',5,chronWar(civ,o),{setId:World.cultures[civ.culture].capital,filter:'war'});
        addFront('army',civ.stateFaith,World.cultures[civ.culture].capital,World.cultures[o.culture].capital);
      }
    }
    if(civ.warWith>=0){
      // war grinds the borderlands
      for(const s of World.settlements)
        if(s.culture===civ.culture&&H()<0.3*dt) s.cond.war=clamp01(s.cond.war+0.15*dt);
      if(World.year>=civ.warEnd && civ.id<civ.warWith){ // resolve once
        resolveWar(civ,World.civs[civ.warWith],H);
      }
    }
  }
  // pilgrimages flow each generation
  if(H()<0.05*dt){
    const pil=livingFaiths().filter(f=>f.vector.pilgrimage>0.6&&f.adherents>3000&&f.holySiteSet>=0);
    if(pil.length){
      const f=rpick(H,pil);
      const srcs=World.settlements.filter(s=>(s.pool[f.id]||0)>0.3&&s.id!==f.holySiteSet);
      if(srcs.length) addFront('pilgrimage',f.id,rpick(H,srcs).id,f.holySiteSet);
    }
  }
}
function resolveWar(a,b,H){
  const win=H()<0.5?a:b, lose=win===a?b:a;
  const holy=a.holyWar;
  a.warWith=b.warWith=-1; World.holyWarActive=false;
  const wf=World.faiths[win.stateFaith];
  if(wf&&!wf.deadYear){
    // conquest: the winner's faith is imposed on borderland settlements
    const flips=World.settlements.filter(s=>s.culture===lose.culture);
    const nFlip=Math.ceil(flips.length*rrange(H,0.2,0.5));
    for(let i=0;i<nFlip&&i<flips.length;i++){
      const s=flips[i];
      const co=0.25+wf.vector.exclusivity*0.4;
      for(const k in s.pool) if(+k!==win.stateFaith) moveShare(s,+k,win.stateFaith,co*World.rates.statePower*0.6);
      s.cond.oppression=clamp01(s.cond.oppression+wf.vector.exclusivity*0.5);
      s.cond.uprooting=clamp01(s.cond.uprooting+0.3);
    }
    emitEvent(holy?'holywarEnd':'warEnd',holy?7:5,chronWarEnd(win,lose,wf,holy),{faithId:wf.id,setId:World.cultures[lose.culture].capital,filter:'war',wantsMontage:holy});
  }
}
function firePersecution(civ,sf,target,cap,H){
  const u={kind:'persecution',sets:new Set(),age:0,startYear:World.year,done:false,
    focus:cap.id, byFaith:sf.id, ofFaith:target.id, civ:civ.id, martyrs:0};
  for(const s of World.settlements) if(s.culture===civ.culture) u.sets.add(s.id);
  World.upheavals.push(u);
  target.underground=true;
  emitEvent('persecution',7,chronPersecution(civ,sf,target),{faithId:target.id,setId:cap.id,filter:'war',hold:true});
  // iconoclasm: an aniconic power breaks the images of an iconic minority
  if(sf.vector.iconography<0.3&&target.vector.iconography>0.6){
    const site=World.settlements.find(s=>s.holySite&&s.holySite.faithId===target.id);
    if(site){ razeHolySite(site,sf,H); }
  }
}
function persecutionTick(u,dt,H){
  const target=World.faiths[u.ofFaith], sf=World.faiths[u.byFaith];
  if(!target||target.deadYear||!sf||sf.deadYear){ u.done=true; return; }
  u.age+=dt;
  for(const sid of u.sets){
    const s=World.settlements[sid];
    s.cond.oppression=clamp01(s.cond.oppression+0.1*dt);
    if(s.pool[u.ofFaith]) moveShare(s,u.ofFaith,u.byFaith,0.06*dt*World.rates.statePower);
  }
  // martyrs: blood is a seed
  if(H()<0.15*dt&&u.martyrs<4){
    u.martyrs++;
    const s=World.settlements[u.focus];
    const fig=makeFigure(H,'martyr',u.ofFaith,u.focus);
    fig.alive=false;
    target.martyrGlow=Math.min(0.9,target.martyrGlow+0.28);
    emitEvent('martyr',9,chronMartyr(fig,target,sf,s),{faithId:target.id,setId:s.id,filter:'war',hold:true});
  }
  if(u.age>rrange(H,8,25)){
    u.done=true;
    if(target.martyrGlow>0.4){
      target.underground=false;
      target.vector.orthodoxy=clamp01(target.vector.orthodoxy+0.2);
      emitEvent('survive',7,chronSurvival(target,sf),{faithId:target.id,filter:'war'});
    } else if(target.adherents<600){
      // stamped out; statusTick will record the ending
      for(const s of World.settlements) if(s.pool[u.ofFaith]) moveShare(s,u.ofFaith,u.byFaith,0.9);
    } else target.underground=false;
  }
}
function razeHolySite(s,byFaith,H){
  const site=s.holySite;
  s.ruins.push({name:site.name,faithId:site.faithId,year:Math.floor(World.year)});
  s.holySite=null;
  emitEvent('iconoclasm',7,chronIconoclasm(site,s,byFaith),{faithId:site.faithId,setId:s.id,filter:'war',hold:true});
}

/* ---------- upheavals part two: prophecy, disenchantment, signs ---------- */
function upheavalsTick(dt,H){
  const L=World.rates.literalism;   // 0 sociological, 1 ambiguous, 2 literal
  // apocalyptic faiths name a date
  for(const f of livingFaiths()){
    if(f.vector.cosmicTime>0.8&&!f.prophecyYear&&f.vector.textuality>0.3&&f.adherents>1500&&H()<0.01*dt){
      f.prophecyYear=Math.floor(World.year+rrange(H,25,110));
      emitEvent('prophecy',6,chronProphecyNamed(f),{faithId:f.id,filter:'sign'});
    }
    if(f.prophecyYear&&World.year>=f.prophecyYear){
      const date=f.prophecyYear; f.prophecyYear=null;
      if(L===2&&H()<0.18){
        // the prophecy is fulfilled: the rarest and greatest of beats
        f.martyrGlow=0.9; f.disgraced=0;
        World.manifestUntil=World.year+30; World.manifestFaith=f.id;
        for(const s of World.settlements) if(s.pool[f.id]) s.pool[f.id]=Math.min(1,s.pool[f.id]*1.8);
        emitEvent('manifest',10,chronManifest(f),{faithId:f.id,setId:f.holySiteSet,filter:'sign',wantsMontage:true,hold:true});
      } else if(H()<0.45+f.vector.orthodoxy*0.2){
        // reinterpretation: the failure becomes a deeper doctrine
        f.vector.cosmicTime=clamp01(f.vector.cosmicTime-0.25);
        f.vector.mysticism=clamp01(f.vector.mysticism+0.2);
        emitEvent('prophecyFail',7,chronProphecyReinterp(f,date),{faithId:f.id,filter:'sign'});
      } else {
        f.disgraced=Math.min(0.9,f.disgraced+0.5);
        emitEvent('prophecyFail',7,chronProphecyFail(f,date),{faithId:f.id,filter:'sign',wantsMontage:true});
      }
    }
  }
  // disenchantment: prosperity and letters thin the air of the gods
  let lit=0,pros=0,n=0;
  for(const s of World.settlements){ lit+=s.literacy; pros+=s.prosperity; n++; }
  lit/=n; pros/=n;
  const secular=livingFaiths().filter(f=>f.vector.theism===5);
  if(lit>0.35&&pros>0.5&&!secular.length&&H()<0.01*dt){
    const s=World.settlements.slice().sort((a,b)=>b.literacy-a.literacy)[0];
    const fig=makeFigure(H,'philosopher',-1,s.id);
    const f=makeFaith(H,{vector:secularVector(H),culture:s.culture,homeSet:s.id,founder:fig.id});
    fig.faithId=f.id; f.founderName=fig.name;
    s.pool[f.id]=(s.pool[f.id]||0)+0.15;
    emitEvent('philosophy',8,chronPhilosophy(fig,f,s),{faithId:f.id,setId:s.id,filter:'found'});
  }
  let secShare=0; if(secular.length){ let sa=0; for(const f of secular) sa+=f.adherents; secShare=sa/Math.max(1,totalPop()); }
  if(secShare>0.3&&!World.disenchantActive){
    World.disenchantActive=true; World.disenchantYear=World.year;
    emitEvent('disenchant',10,chronDisenchant(),{filter:'found',wantsMontage:true});
  }
  if(World.disenchantActive){
    if(secShare<0.18){
      World.disenchantActive=false;
      emitEvent('revival',8,chronRevival(),{filter:'found',wantsMontage:true});
    } else if(World.year-World.disenchantYear>500) World.disenchantActive=false;
  }
  // the dragon-beat: on the literal dial, a faith fervent enough and vast
  // enough can call its god into the world
  if(L===2&&(!World.manifestUntil||World.year>World.manifestUntil+800)){
    for(const f of livingFaiths()){
      if(f.vector.theism===5) continue;
      const share=f.adherents/Math.max(1,totalPop());
      const devotion=share*(f.vector.ritualDensity+f.martyrGlow+f.vector.purity);
      if(share>0.42&&devotion>0.75&&H()<0.004*dt){
        World.manifestUntil=World.year+30;
        World.manifestFaith=f.id;
        f.martyrGlow=0.9; f.disgraced=0;
        for(const s of World.settlements){
          if(s.pool[f.id]) s.pool[f.id]=Math.min(1,s.pool[f.id]*2.2);
          s.cond.uprooting=clamp01(s.cond.uprooting+0.2);   // the world is remade
        }
        for(const o of livingFaiths()) if(o.id!==f.id&&o.vector.theism!==5)
          o.disgraced=Math.min(0.9,o.disgraced+0.4);
        World.eraName='The Coming of '+(f.deity||f.coreName); World.eraStart=World.year;
        emitEvent('era',5,null,{era:World.eraName});
        emitEvent('manifest',10,chronGodComes(f),{faithId:f.id,setId:f.holySiteSet,filter:'sign',wantsMontage:false,hold:true});
        break;
      }
    }
  }
  // signs in the sky
  if(H()<0.008*dt*World.rates.upheaval){
    const kind=rpick(H,['comet','eclipse','redmoon']);
    World.omens.push({kind,year:World.year,until:World.year+3});
    const mil=livingFaiths().filter(f=>f.vector.cosmicTime>0.6);
    for(const f of mil) f.martyrGlow=Math.min(0.9,f.martyrGlow+0.1);
    if(L===2&&H()<0.15){
      const f=rpick(H,livingFaiths());
      const s=World.settlements[f.holySiteSet>=0?f.holySiteSet:0];
      const u=World.upheavals.find(x=>x.kind==='pestilence'&&!x.done);
      if(u){ u.done=true;
        for(const sid of u.sets) World.settlements[sid].cond.pestilence=0;
        f.martyrGlow=Math.min(0.9,f.martyrGlow+0.4);
        emitEvent('miracle',9,chronMiracle(f,s,kind),{faithId:f.id,setId:s.id,filter:'sign',hold:true});
      } else emitEvent('omen',4,chronOmen(kind),{filter:'sign'});
    } else emitEvent('omen',4,chronOmen(kind),{filter:'sign'});
  }
  World.omens=World.omens.filter(o=>World.year<o.until+2);
}

/* ---------- fronts (render subjects) ---------- */
function addFront(kind,faithId,fromSet,toSet){
  const road=findRoadPath(fromSet,toSet);
  if(!road) return;
  World.fronts.push({kind,faithId,path:road,t0:World.year,
    t1:World.year+Math.max(2,road.length*0.15),from:fromSet,to:toSet});

function findRoadPath(a,b){
  // BFS through the road graph, concatenating cell paths
  if(a===b) return null;
  const prev={}; const q=[a]; const seen=new Set([a]);
  while(q.length){
    const cur=q.shift();
    if(cur===b) break;
    for(const e of (World.roadAdj[cur]||[])) if(!seen.has(e.to)){ seen.add(e.to); prev[e.to]=cur; q.push(e.to); }
  }
  if(!seen.has(b)) return null;
  const hops=[b]; let x=b;
  while(prev[x]!==undefined){ x=prev[x]; hops.push(x); }
  hops.reverse();
  const cells=[];
  for(let i=0;i<hops.length-1;i++){
    const r=World.roads.find(r=>(r.a===hops[i]&&r.b===hops[i+1])||(r.b===hops[i]&&r.a===hops[i+1]));
    if(!r) return null;
    const seg=r.a===hops[i]?r.path:r.path.slice().reverse();
    cells.push(...seg);
  }

}

const chronScrollEl=()=>document.getElementById('chronScroll');
let chronFilter='all';
function chronAppend(ev){
  const el=chronScrollEl(); if(!el) return;
  if(chronFilter!=='all'&&ev.filter!==chronFilter) return;
  const div=document.createElement('div');
  div.className='entry c'+(ev.filter==='found'?'Found':ev.filter==='war'?'War':ev.filter==='sign'?'Sign':ev.filter==='schism'?'Schism':'');
  const t=ev.text;
  div.innerHTML=`<div class="yr">${fmtYear(ev.year)}</div><span class="dropcap">${t.charAt(0)}</span>${escapeHtml(t.slice(1))}`;
  div.onclick=()=>flyToEvent(ev);
  // optional enhancement when running where the Anthropic API is exposed
  // (a Claude artifact): expand one entry into a fuller scholarly note
  if(typeof window!=='undefined'&&window.claude&&typeof window.claude.complete==='function'){
    const btn=document.createElement('span');
    btn.textContent=' ✦';
    btn.title='Illuminate this entry';
    btn.style.cssText='cursor:pointer;color:#c9a227;';
    btn.onclick=(e)=>{ e.stopPropagation(); illuminateEntry(ev,div,btn); };
    div.appendChild(btn);
  }
  el.appendChild(div);
  while(el.children.length>250) el.removeChild(el.firstChild);
  const nearBottom = el.scrollHeight-el.scrollTop-el.clientHeight<160;
  if(nearBottom) el.scrollTop=el.scrollHeight;
  // a quiet chime as each entry is set down, never more than one a second
  if(typeof sfx==='function'&&typeof AudioSys!=='undefined'){
    const now=performance.now();
    if(now-AudioSys.lastChime>1100&&World.speed<=3){ AudioSys.lastChime=now; sfx('chime'); }
  }
}
function chronAppendEra(name){

async function illuminateEntry(ev,div,btn){
  btn.textContent=' …';
  const f=ev.faithId!==undefined?World.faiths[ev.faithId]:null;
  const context=f?` The faith concerned, ${f.name}, holds: ${f.tenets.join('; ')}.`:'';
  const fallback=()=>{
    const extra=' Later scholarship adds little, except to note that the local tradition remembered the event differently in every generation, and that each remembering tells us more about the rememberers than the event.';
    div.insertBefore(document.createTextNode(extra),btn);
    btn.remove();
  };
  try{
    const prompt=`You are a far-future philologist reconstructing the spiritual history of an invented world from scripture, inscription, and ruin. Expand the following chronicle entry into one additional scholarly paragraph (3 to 4 sentences), in the same measured, evenhanded voice. Do not use em dashes. Entry: "${ev.text}"${context}`;
    const resp=await window.claude.complete(prompt);
    const text=typeof resp==='string'?resp:(resp&&resp.completion)||'';
    if(text.trim()){
      div.insertBefore(document.createTextNode(' '+text.trim().replace(/—/g,', ')),btn);
      btn.remove();
    } else fallback();
  }catch(e){ fallback(); }
}
function chronRebuild(){
  const el=chronScrollEl(); el.innerHTML='';
  let lastEra=null;
  const evs=World.events.filter(e=>e.text&&(chronFilter==='all'||e.filter===chronFilter)).slice(-240);
  for(const ev of evs) chronAppend(ev);
  el.scrollTop=el.scrollHeight;
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function exportRecord(){
  let out=`THE RECORD OF ${World.name.toUpperCase()}\nbeing a reconstruction of the spiritual history of that world\nseed ${World.seed}\n\n`;
  let era=null;
  for(const ev of World.events){
    if(ev.era){ out+='\n════ '+ev.era+' ════\n\n'; continue; }
    if(ev.text) out+=fmtYear(ev.year)+'. '+ev.text+'\n\n';
  }
  download(World.name.toLowerCase()+'-record.txt',out);
}
function exportTree(){
  let out=`THE TREE OF FAITHS OF ${World.name.toUpperCase()}\nseed ${World.seed}\n\n`;
  const roots=World.faiths.filter(f=>!f.parentIds.length);
  const seen=new Set();
  function walk(f,depth){
    const pad='  '.repeat(depth);
    const span=f.deadYear?`${fmtYear(f.originYear)} to ${fmtYear(f.deadYear)}`:`${fmtYear(f.originYear)} to the present`;
    out+=`${pad}${f.name} (${span}; ${f.deadYear?'dead; peak '+fmtNum(f.peakAdherents):fmtNum(f.adherents)+' believers'})${f.syncretic?' [syncretic]':''}\n`;
    if(seen.has(f.id)) return; seen.add(f.id);
    for(const cid of f.childrenIds) walk(World.faiths[cid],depth+1);
  }
  for(const r of roots) walk(r,0);
  download(World.name.toLowerCase()+'-tree.txt',out);
}
function download(fname,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));
  a.download=fname; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

   roads, holy sites, fronts, sky) and the label layer.
   ============================================================ */
const R3 = {};   // render state
const ELEV = 3.2;   // vertical exaggeration; low enough that the limb stays round

function elevAt(p){ // continuous elevation for smooth terrain (same fields as cells)
  const f=warpedFbm(p.x*1.6,p.y*1.6,p.z*1.6,5);
  let conv=0; // cheap plate ridge approx: sample nearest cell's stored convergence
  const c=nearestCell(p); if(c) conv=clamp(c.plateConv,-1.5,2.5)*0.22;
  return f*0.55+conv+SIMPLEX2(p.x*4,p.y*4,p.z*4)*0.08-World.seaLevel;
}
let cellGrid=null;
function buildCellGrid(){
  cellGrid={res:24,bins:{}};
  for(const c of World.cells){
    const k=gridKey(c.p); (cellGrid.bins[k]=cellGrid.bins[k]||[]).push(c);
  }
}
function gridKey(p){
  const r=cellGrid.res;
  return Math.floor((p.x+1)/2*r)+','+Math.floor((p.y+1)/2*r)+','+Math.floor((p.z+1)/2*r);
}
function nearestCell(p){
  if(!cellGrid) buildCellGrid();
  const r=cellGrid.res;
  const ix=Math.floor((p.x+1)/2*r), iy=Math.floor((p.y+1)/2*r), iz=Math.floor((p.z+1)/2*r);
  let best=null,bd=-2;
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){
    const bin=cellGrid.bins[(ix+dx)+','+(iy+dy)+','+(iz+dz)];
    if(!bin) continue;
    for(const c of bin){ const d=c.p.dot(p); if(d>bd){bd=d;best=c;} }
  }
  return best;
}
const BIOME_COL={
  [BIOME.OCEAN]:[0.10,0.19,0.31],[BIOME.COAST]:[0.17,0.31,0.40],[BIOME.RIVER]:[0.33,0.44,0.27],
  [BIOME.MARSH]:[0.31,0.38,0.28],[BIOME.GRASS]:[0.44,0.48,0.29],[BIOME.FOREST]:[0.25,0.35,0.22],
  [BIOME.DESERT]:[0.69,0.59,0.41],[BIOME.STEPPE]:[0.55,0.50,0.34],[BIOME.ALPINE]:[0.50,0.48,0.46],
  [BIOME.TUNDRA]:[0.52,0.52,0.48],[BIOME.ICE]:[0.85,0.87,0.91]
};

function initRenderer(){

function buildGlobe(){
  const g=new THREE.IcosahedronGeometry(PLANET_R,7);
  const pos=g.attributes.position;
  const colors=new Float32Array(pos.count*3);
  const tmp=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    tmp.set(pos.getX(i),pos.getY(i),pos.getZ(i)).normalize();
    const e=elevAt(tmp);
    const c=nearestCell(tmp);
    const h=Math.max(0,e);
    pos.setXYZ(i,tmp.x*(PLANET_R+h*ELEV),tmp.y*(PLANET_R+h*ELEV),tmp.z*(PLANET_R+h*ELEV));
    let col;
    if(e<=0) col=BIOME_COL[c&&c.temp<-8?BIOME.ICE:BIOME.OCEAN];
    else col=BIOME_COL[c?c.biome:BIOME.GRASS];
    // painterly variation, brightened for the jewel-toned register
    const v=(0.94+SIMPLEX2(tmp.x*9,tmp.y*9,tmp.z*9)*0.09)*(e<=0?1:1.28);
    colors[i*3]=Math.min(1,col[0]*v); colors[i*3+1]=Math.min(1,col[1]*v); colors[i*3+2]=Math.min(1,col[2]*v);
    if(e>0.45){ const s=clamp01((e-0.45)/0.2); // snowcaps
      colors[i*3]=lerp(colors[i*3],0.92,s); colors[i*3+1]=lerp(colors[i*3+1],0.93,s); colors[i*3+2]=lerp(colors[i*3+2],0.97,s); }
  }
  g.setAttribute('color',new THREE.BufferAttribute(colors,3));
  g.computeVertexNormals();
  R3.globe=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  R3.scene.add(R3.globe);
  // ocean
  R3.ocean=new THREE.Mesh(new THREE.SphereGeometry(PLANET_R+0.02,128,96),
    new THREE.MeshPhongMaterial({color:0x2a5a8e,transparent:true,opacity:0.78,shininess:90,specular:0x557799}));
  R3.scene.add(R3.ocean);
  // the air itself: a limb glow, brightest at the planet's edge, thinning to space
  R3.atmo=new THREE.Mesh(new THREE.SphereGeometry(PLANET_R*1.05,64,48),
    new THREE.ShaderMaterial({
      transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.BackSide,
      vertexShader:`varying vec3 vWN; varying vec3 vWP;
        void main(){ vWN=normalize(mat3(modelMatrix)*normal); vWP=(modelMatrix*vec4(position,1.)).xyz;
          gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
      fragmentShader:`varying vec3 vWN; varying vec3 vWP;
        void main(){
          vec3 v=normalize(cameraPosition-vWP);
          float d=dot(vWN,v);                    // 0 at the shell rim, negative toward the limb
          float f=pow(clamp(-d*2.6,0.0,1.0),1.5);
          gl_FragColor=vec4(vec3(0.36,0.56,0.95)*f,f*0.75); }`
    }));
  R3.scene.add(R3.atmo);
  // faith overlay: equirect canvas texture on a slightly larger shell
  R3.ovCanvas=document.createElement('canvas'); R3.ovCanvas.width=1024; R3.ovCanvas.height=512;
  R3.ovTex=new THREE.CanvasTexture(R3.ovCanvas);
  const shellG=new THREE.SphereGeometry(PLANET_R*1.012,96,64);
  R3.ovMesh=new THREE.Mesh(shellG,new THREE.MeshBasicMaterial({map:R3.ovTex,transparent:true,opacity:0.5,depthWrite:false}));
  R3.ovMesh.rotation.y=-Math.PI/2;   // align equirect to latLonToV3
  R3.scene.add(R3.ovMesh);
  buildRoads();
  buildSites();
  buildSettlementMarkers();
  R3.frontPts=null;
  // hover ring, selection ring, and a small pool of event pings
  const ringG=new THREE.RingGeometry(1.15,1.5,40);
  R3.hoverRing=new THREE.Mesh(ringG,new THREE.MeshBasicMaterial({color:0xf0e0a8,transparent:true,
    opacity:0.75,side:THREE.DoubleSide,depthWrite:false}));
  R3.hoverRing.visible=false; R3.scene.add(R3.hoverRing);
  R3.selRing=new THREE.Mesh(ringG,new THREE.MeshBasicMaterial({color:0xd8b23a,transparent:true,
    opacity:0.95,side:THREE.DoubleSide,depthWrite:false}));
  R3.selRing.visible=false; R3.scene.add(R3.selRing);
  R3.pings=[];
  for(let i=0;i<5;i++){
    const p=new THREE.Mesh(ringG,new THREE.MeshBasicMaterial({color:0xf4e0a0,transparent:true,
      opacity:0,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));
    p.visible=false; p.userData.t=99;
    R3.scene.add(p); R3.pings.push(p);
  }
  refreshOverlay(true);
}
function placeRingAt(ring,setId,scale){
  const s=World.settlements[setId];
  if(!s){ ring.visible=false; return; }
  const c=World.cells[s.cell];
  ring.position.copy(cellSurfacePos(c,0.6));
  ring.quaternion.setFromUnitVectors(v3(0,0,1),c.p);
  ring.scale.setScalar(scale||1.6);
  ring.visible=true;
}
function spawnPing(setId){
  if(!R3.pings) return;
  const p=R3.pings.find(x=>x.userData.t>=1.4)||R3.pings[0];
  placeRingAt(p,setId,1);
  p.userData.t=0;
  if(typeof sfx==='function'&&CameraRig.mode==='globe') sfx('ping');
}
function updatePings(dtReal){
  if(!R3.pings) return;
  for(const p of R3.pings){
    if(p.userData.t>=1.4){ p.visible=false; continue; }
    p.userData.t+=dtReal;
    const t=p.userData.t/1.4;
    p.scale.setScalar(1+t*7);
    p.material.opacity=0.85*(1-t);
    p.visible=true;
  }
}
function cellSurfacePos(c,lift){
  const h=Math.max(0,c.elev);
  return c.p.clone().multiplyScalar(PLANET_R+h*ELEV+(lift||0.15));
}
function buildRoads(){
  const verts=[],cols=[];
  for(const r of World.roads){
    const b=r.artery?0.9:0.5;
    for(let i=0;i<r.path.length-1;i++){
      const a=cellSurfacePos(World.cells[r.path[i]],0.25), c=cellSurfacePos(World.cells[r.path[i+1]],0.25);
      verts.push(a.x,a.y,a.z,c.x,c.y,c.z);
      cols.push(0.75*b,0.62*b,0.4*b, 0.75*b,0.62*b,0.4*b);
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  R3.roads=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:0.75}));
  R3.scene.add(R3.roads);
}
function buildSites(){
  const n=World.settlements.length;
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(n*3),3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(new Float32Array(n*3),3));
  const tex=makeGlowTexture();
  R3.sites=new THREE.Points(g,new THREE.PointsMaterial({size:6,map:tex,transparent:true,
    blending:THREE.AdditiveBlending,depthWrite:false,vertexColors:true,sizeAttenuation:true}));
  R3.scene.add(R3.sites);
}
function makeGlowTexture(){
  const cv=document.createElement('canvas');cv.width=cv.height=32;
  const g=cv.getContext('2d');
  const gr=g.createRadialGradient(16,16,0,16,16,16);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.4,'rgba(255,240,200,0.5)');gr.addColorStop(1,'rgba(255,240,200,0)');
  g.fillStyle=gr;g.fillRect(0,0,32,32);
  return new THREE.CanvasTexture(cv);
}
function buildSettlementMarkers(){
  const n=World.settlements.length;
  // town cluster
  const boxG=new THREE.BoxGeometry(0.7,0.5,0.7);
  R3.towns=new THREE.InstancedMesh(boxG,new THREE.MeshLambertMaterial(),n);
  // temple marker
  const coneG=new THREE.ConeGeometry(0.5,1.4,5);
  R3.temples=new THREE.InstancedMesh(coneG,new THREE.MeshLambertMaterial(),n);
  const m=new THREE.Matrix4(), q=new THREE.Quaternion(), up=v3(0,1,0), sc=new THREE.Vector3();
  for(let i=0;i<n;i++){
    const s=World.settlements[i], c=World.cells[s.cell];
    const p=cellSurfacePos(c,0.1);
    q.setFromUnitVectors(up,c.p);
    const k=(s.kind==='capital'?1.6:s.kind==='town'?1.1:0.7)*1.5;
    sc.set(k,k,k);
    m.compose(p,q,sc);
    R3.towns.setMatrixAt(i,m);
    const p2=cellSurfacePos(c,0.7);
    sc.set(k*0.9,k*0.9,k*0.9);
    m.compose(p2,q,sc);
    R3.temples.setMatrixAt(i,m);
    R3.towns.setColorAt(i,new THREE.Color(0.6,0.5,0.38));
    R3.temples.setColorAt(i,new THREE.Color(0.8,0.7,0.5));
  }
  R3.scene.add(R3.towns); R3.scene.add(R3.temples);
}
function buildSky(){
  // stars
  const n=1600, posArr=new Float32Array(n*3);
  const S=makeStream(World.seed,'stars');
  for(let i=0;i<n;i++){
    const v=v3(rgauss(S),rgauss(S),rgauss(S)).normalize().multiplyScalar(1800);
    posArr[i*3]=v.x;posArr[i*3+1]=v.y;posArr[i*3+2]=v.z;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(posArr,3));
  R3.stars=new THREE.Points(g,new THREE.PointsMaterial({color:0x9db0d8,size:1.6,sizeAttenuation:false,transparent:true,opacity:0.8}));
  R3.scene.add(R3.stars);
  // comet sprite for omens
  const cv=document.createElement('canvas');cv.width=64;cv.height=16;
  const cg=cv.getContext('2d');
  const gr=cg.createLinearGradient(0,8,64,8);
  gr.addColorStop(0,'rgba(200,220,255,0)');gr.addColorStop(0.85,'rgba(220,235,255,0.8)');gr.addColorStop(1,'rgba(255,255,255,1)');
  cg.fillStyle=gr;cg.fillRect(0,4,64,8);
  R3.comet=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true}));
  R3.comet.scale.set(60,14,1); R3.comet.visible=false;
  R3.scene.add(R3.comet);
}

/* ---------- overlays ---------- */
let overlayMode='faiths';
let ovTimer=0, ovTmp=null;
function refreshOverlay(force){
  const gMain=R3.ovCanvas.getContext('2d');
  // territory fields draw to a scratch canvas, composite through one blur,
  // then take inked border stippling on top: a map, not a spray
  if(!ovTmp){ ovTmp=document.createElement('canvas'); ovTmp.width=1024; ovTmp.height=512; }
  const g=ovTmp.getContext('2d');
  g.clearRect(0,0,1024,512);
  const cellR=1024/Math.sqrt(NCELLS)*0.6;
  for(const c of World.cells){
    if(c.elev<=0) continue;
    let col=null;
    if(overlayMode==='faiths'||overlayMode==='syncretism'||overlayMode==='tolerance'){
      if(c.nearSet<0) continue;
      const s=World.settlements[c.nearSet];
      if(overlayMode==='faiths'){
        const dom=dominantFaith(s);
        if(dom===null||!World.faiths[dom]) continue;
        const f=World.faiths[dom];
        const alpha=clamp01((s.pool[dom]||0)*1.2);
        col=`hsla(${f.hue},62%,52%,${alpha*0.8})`;
      } else if(overlayMode==='syncretism'){
        const entries=Object.values(s.pool).filter(v=>v>0.2);
        col=entries.length>=2?`rgba(230,140,255,${0.3+(s.syncT||0)/120})`:null;
      } else {
        let tol=0,n=0;
        for(const k in s.pool){const f=World.faiths[k];if(f){tol+=(1-f.vector.exclusivity)*s.pool[k];n+=s.pool[k];}}
        col=n?`hsla(${lerp(0,140,tol/n)},60%,45%,0.6)`:null;
      }
    } else if(overlayMode==='prosperity'){
      if(c.nearSet<0) continue;
      col=`hsla(${lerp(10,120,World.settlements[c.nearSet].prosperity)},70%,45%,0.6)`;
    } else if(overlayMode==='unrest'){
      if(c.nearSet<0) continue;
      const s=World.settlements[c.nearSet];
      const u=clamp01(s.unrest+s.cond.oppression*0.5);
      if(u<0.05) continue;
      col=`hsla(${lerp(60,0,u)},80%,50%,${0.25+u*0.5})`;
    } else if(overlayMode==='literacy'){
      if(c.nearSet<0) continue;
      col=`hsla(215,70%,${20+World.settlements[c.nearSet].literacy*55}%,0.65)`;
    } else if(overlayMode==='spread'){
      col=null; // flows drawn by front points; tint contested zones lightly
      if(c.nearSet>=0){
        const s=World.settlements[c.nearSet];
        const dom=dominantFaith(s);
        if(dom!==null&&World.faiths[dom]&&World.faiths[dom].status==='spreading')
          col=`hsla(${World.faiths[dom].hue},70%,55%,0.5)`;
      }
    } else if(overlayMode==='terrain') col=null;
    if(!col) continue;
    const x=(c.lon+180)/360*1024, y=(90-c.lat)/180*512;
    g.fillStyle=col;
    g.beginPath();g.arc(x,y,cellR*1.12,0,TAU);g.fill();
  }
  gMain.clearRect(0,0,1024,512);
  try{ gMain.filter='blur(3px)'; gMain.drawImage(ovTmp,0,0); gMain.filter='none'; }
  catch(e){ gMain.drawImage(ovTmp,0,0); }
  // inked boundaries where dominant faiths meet
  if(overlayMode==='faiths'){
    const dom={};
    for(const st of World.settlements) dom[st.id]=dominantFaith(st);
    gMain.fillStyle='rgba(24,16,8,0.55)';
    for(const c of World.cells){
      if(c.elev<=0||c.nearSet<0) continue;
      const fa=dom[c.nearSet];
      if(fa===null) continue;
      for(const ni of c.nbr){
        const o=World.cells[ni];
        if(ni<c.id||o.elev<=0||o.nearSet<0) continue;
        const fb=dom[o.nearSet];
        if(fb===null||fb===fa) continue;
        const mx=((c.lon+o.lon)/2+180)/360*1024, my=(90-(c.lat+o.lat)/2)/180*512;
        if(Math.abs(c.lon-o.lon)>180) continue;   // seam wrap
        gMain.beginPath(); gMain.arc(mx,my,2.1,0,TAU); gMain.fill();
      }
    }
  }
  R3.ovTex.needsUpdate=true;
  R3.ovMesh.visible=overlayMode!=='terrain';
  // holy site glows and marker colors
  const pos=R3.sites.geometry.attributes.position, col=R3.sites.geometry.attributes.color;
  const cc=new THREE.Color();
  for(let i=0;i<World.settlements.length;i++){
    const s=World.settlements[i], c=World.cells[s.cell];
    const p=cellSurfacePos(c,1.2);
    if(s.holySite&&World.faiths[s.holySite.faithId]&&!World.faiths[s.holySite.faithId].deadYear){
      pos.setXYZ(i,p.x,p.y,p.z);
      cc.set(World.faiths[s.holySite.faithId].color);
      col.setXYZ(i,cc.r,cc.g,cc.b);
    } else pos.setXYZ(i,0,0,0);
    const dom=dominantFaith(s);
    if(dom!==null&&World.faiths[dom]){
      cc.set(World.faiths[dom].color);
      R3.temples.setColorAt(i,cc);
    }
  }
  pos.needsUpdate=true; col.needsUpdate=true;
  if(R3.temples.instanceColor) R3.temples.instanceColor.needsUpdate=true;
}

/* ---------- fronts & flows: moving points along roads ----------
   Transient fronts (a mission, an army sent) interpolate in sim time.
   Standing flows (pilgrim arteries, active war roads) are derived from
   state and animate in real time, so they read at any sim speed. */
let flowCache={at:-1,flows:[]};
function computeFlows(){
  const now=performance.now()/1000;
  if(now-flowCache.at<20) return flowCache.flows;
  flowCache.at=now;
  const flows=[];
  const pil=livingFaiths().filter(f=>f.vector.pilgrimage>0.55&&f.adherents>2500&&f.holySiteSet>=0)
    .sort((a,b)=>b.adherents-a.adherents).slice(0,5);
  for(const f of pil){
    const srcs=World.settlements.filter(s=>(s.pool[f.id]||0)>0.3&&s.id!==f.holySiteSet)
      .sort((a,b)=>(b.pool[f.id]||0)*b.pop-(a.pool[f.id]||0)*a.pop).slice(0,2);
    for(const s of srcs){
      const path=findRoadPath(s.id,f.holySiteSet);
      if(path&&path.length>2) flows.push({path,f,kind:'pilgrimage',n:6});
    }
  }
  for(const civ of World.civs){
    if(civ.warWith>=0&&civ.id<civ.warWith){
      const f=World.faiths[civ.stateFaith];
      if(!f) continue;
      const path=findRoadPath(World.cultures[civ.culture].capital,
        World.cultures[World.civs[civ.warWith].culture].capital);
      if(path&&path.length>2) flows.push({path,f,kind:'army',n:6});
    }
  }
  flowCache.flows=flows;
  return flows;
}
function updateFronts(){
  World.fronts=World.fronts.filter(f=>World.year<f.t1+1);
  const list=[];
  const rt=performance.now()/1000;
  for(const fr of World.fronts){
    const f=World.faiths[fr.faithId];
    if(!f) continue;
    const t=clamp01((World.year-fr.t0)/(fr.t1-fr.t0));
    const nDots=fr.kind==='army'?5:fr.kind==='pilgrimage'?7:3;
    for(let i=0;i<nDots;i++){
      const tt=clamp01(t-i*0.03);
      const idx=tt*(fr.path.length-1);
      const a=World.cells[fr.path[Math.floor(idx)]], b=World.cells[fr.path[Math.min(fr.path.length-1,Math.ceil(idx))]];
      const p=a.p.clone().lerp(b.p,idx%1).normalize();
      const e=Math.max(0,elevAt(p));
      list.push({p:p.multiplyScalar(PLANET_R+e*ELEV+0.5),f,kind:fr.kind});
    }
  }
  for(const fl of computeFlows()){
    for(let i=0;i<fl.n;i++){
      const tt=((rt*0.045)+(i/fl.n))%1;
      const idx=tt*(fl.path.length-1);
      const a=World.cells[fl.path[Math.floor(idx)]], b=World.cells[fl.path[Math.min(fl.path.length-1,Math.ceil(idx))]];
      const p=a.p.clone().lerp(b.p,idx%1).normalize();
      const e=Math.max(0,elevAt(p));
      list.push({p:p.multiplyScalar(PLANET_R+e*ELEV+0.5),f:fl.f,kind:fl.kind});
    }
  }
  if(!R3.frontPts||R3.frontCap<list.length){
    if(R3.frontPts) R3.scene.remove(R3.frontPts);
    R3.frontCap=Math.max(64,list.length);
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(R3.frontCap*3),3));
    g.setAttribute('color',new THREE.Float32BufferAttribute(new Float32Array(R3.frontCap*3),3));
    R3.frontPts=new THREE.Points(g,new THREE.PointsMaterial({size:3.4,map:makeGlowTexture(),
      transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,vertexColors:true}));
    R3.scene.add(R3.frontPts);
  }
  const pos=R3.frontPts.geometry.attributes.position,colA=R3.frontPts.geometry.attributes.color;
  const cc=new THREE.Color();
  for(let i=0;i<R3.frontCap;i++){
    if(i<list.length){
      pos.setXYZ(i,list[i].p.x,list[i].p.y,list[i].p.z);
      cc.set(list[i].f.color);
      if(list[i].kind==='army') cc.offsetHSL(0,0,0.15);
      colA.setXYZ(i,cc.r,cc.g,cc.b);
    } else pos.setXYZ(i,0,0,0);
  }
  pos.needsUpdate=true;colA.needsUpdate=true;
}

/* ---------- labels ---------- */
function drawLabels(alt){
  const g=document.getElementById('labels').getContext('2d');
  g.clearRect(0,0,innerWidth,innerHeight);
  if(CameraRig.mode!=='globe'||document.body.classList.contains('watch')) return;
  if(!World.showLabels) return;
  if(alt>PLANET_R*2.2) { drawFaithLabels(g); return; }
  if(alt>PLANET_R*0.04){
    const v=new THREE.Vector3();
    g.font='11px Georgia'; g.textAlign='center';
    for(const s of World.settlements){
      if(alt>PLANET_R*0.9&&s.kind==='village') continue;
      const c=World.cells[s.cell];
      if(c.p.dot(R3.camera.position.clone().normalize())<0.55) continue;
      v.copy(cellSurfacePos(c,2)); v.project(R3.camera);
      if(v.z>1) continue;
      const x=(v.x+1)/2*innerWidth, y=(1-v.y)/2*innerHeight;
      g.fillStyle='rgba(10,8,4,0.55)';
      g.fillText(s.name,x+1,y-7);
      g.fillStyle=s.kind==='capital'?'#f0dfae':'#cdbf9b';
      g.fillText(s.name,x,y-8);
    }
    if(alt<=PLANET_R*0.9) drawFaithLabels(g);
  } else drawFaithLabels(g);
}
function drawFaithLabels(g){
  // faith names at adherent-weighted centroids
  g.font='italic 15px Georgia'; g.textAlign='center';
  const live=livingFaiths().sort((a,b)=>b.adherents-a.adherents).slice(0,9);
  const v=new THREE.Vector3();
  for(const f of live){
    if(f.adherents<800) continue;
    let cx=v3(0,0,0),w=0;
    for(const s of World.settlements){
      const sh=s.pool[f.id]||0; if(sh<0.2) continue;
      cx.add(World.cells[s.cell].p.clone().multiplyScalar(sh*s.pop)); w+=sh*s.pop;
    }
    if(w<1) continue;
    cx.normalize();
    if(cx.dot(R3.camera.position.clone().normalize())<0.6) continue;
    v.copy(cx.multiplyScalar(PLANET_R+4)); v.project(R3.camera);
    if(v.z>1) continue;
    const x=(v.x+1)/2*innerWidth,y=(1-v.y)/2*innerHeight;
    g.fillStyle='rgba(0,0,0,0.6)'; g.fillText(f.name,x+1,y+1);
    g.fillStyle=f.color; g.fillText(f.name,x,y);
  }
}

/* ---------- sky & time of day ---------- */
let cometPhase=0;
R3.dayPhase=0.32;   // visual day cycle, advanced in real time so it never flickers
function dayRate(){ return [0,0.010,0.028,0,0][World.speed]||0; }
function updateSky(dtReal){
  R3.dayPhase=(R3.dayPhase+dtReal*dayRate())%1;
  // the globe rides a standing golden hour that always lights the viewed
  // face; true day and night belong to the bubble, where the lamps are.
  {
    const cd=R3.camera.position.clone().normalize();
    const east=v3(0,1,0).cross(cd).normalize();
    if(east.lengthSq()<0.01) east.set(1,0,0);
    R3.sun.position.copy(cd.multiplyScalar(280).add(east.multiplyScalar(150)).add(v3(0,80,0)));
    if(World.speed<=2){
      const sunH=Math.sin(R3.dayPhase*TAU);
      R3.sites.material.size=6+clamp01(-sunH+0.3)*4;   // shrine lamps swell toward evening
    }
  }
  const omen=World.omens.find(o=>o.kind==='comet');
  if(omen){
    R3.comet.visible=true;
    cometPhase+=dtReal*0.02;
    R3.comet.position.copy(v3(Math.cos(cometPhase)*600,300,Math.sin(cometPhase)*600));
  } else R3.comet.visible=false;
  const ecl=World.omens.find(o=>o.kind==='eclipse');
  if(ecl) R3.sun.intensity=0.3;
  else if(World.speed>2) R3.sun.intensity=1.15;
  const red=World.omens.find(o=>o.kind==='redmoon');
  R3.scene.background.setHex(red?0x120608:0x05060e);
  // a divine manifestation stands as a pillar of light over the holy city
  const manifest=World.manifestUntil&&World.year<World.manifestUntil&&World.faiths[World.manifestFaith];
  if(manifest){
    if(!R3.pillar){
      R3.pillar=new THREE.Mesh(new THREE.CylinderGeometry(1.2,2.6,60,8,1,true),
        new THREE.MeshBasicMaterial({color:0xfff2c0,transparent:true,opacity:0.5,
          blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
      R3.scene.add(R3.pillar);
    }
    const f=World.faiths[World.manifestFaith];
    const s=World.settlements[f.holySiteSet>=0?f.holySiteSet:0];
    const c=World.cells[s.cell];
    R3.pillar.position.copy(cellSurfacePos(c,30));
    R3.pillar.quaternion.setFromUnitVectors(v3(0,1,0),c.p);
    R3.pillar.material.opacity=0.35+Math.sin(performance.now()/300)*0.15;
    R3.pillar.visible=true;
  } else if(R3.pillar) R3.pillar.visible=false;
  // aurora over the poles
  if(!R3.aurora){
    R3.aurora=[];
    for(const pole of [1,-1]){
      const geo=new THREE.TorusGeometry(PLANET_R*0.42,PLANET_R*0.05,2,40);
      const m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:pole>0?0x50d890:0x6890e8,
        transparent:true,opacity:0.12,blending:THREE.AdditiveBlending,depthWrite:false}));
      m.position.y=pole*PLANET_R*0.94; m.rotation.x=Math.PI/2;
      R3.scene.add(m); R3.aurora.push(m);
    }
  }
  for(let i=0;i<R3.aurora.length;i++){
    R3.aurora[i].material.opacity=0.08+Math.sin(performance.now()/1700+i*2)*0.05;
    R3.aurora[i].rotation.z+=dtReal*0.05;
  }
}
/* ============================================================
   Section: the carver's bench. Procedural geometry helpers for
   the museum-diorama register: lathed (revolved) sacred forms,
   beveled masonry, gable roofs, ornament. All generated, none
   loaded; polygon budget is not the constraint, silhouette is.
   ============================================================ */
function latheGeo(pts,segs){
  const v=pts.map(p=>new THREE.Vector2(p[0],p[1]));
  const g=new THREE.LatheGeometry(v,segs||44);
  g.computeVertexNormals();
  return g;
}
// beveled box: extruded rounded rectangle, centered, lying on y=0
function bevelBox(w,h,d,bev){
  const b=Math.min(bev||0.08, w*0.24, d*0.24);
  const s=new THREE.Shape();
  const x=w/2-b, z=d/2-b;
  s.moveTo(-x,-d/2); s.lineTo(x,-d/2);
  s.absarc(x,-z,b,-Math.PI/2,0,false);
  s.lineTo(w/2,z);
  s.absarc(x,z,b,0,Math.PI/2,false);
  s.lineTo(-x,d/2);
  s.absarc(-x,z,b,Math.PI/2,Math.PI,false);
  s.lineTo(-w/2,-z);
  s.absarc(-x,-z,b,Math.PI,Math.PI*1.5,false);
  const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelThickness:b,bevelSize:b*0.8,bevelSegments:3,curveSegments:5});
  g.rotateX(-Math.PI/2);
  g.translate(0,b*0.8,0);   // base rests at ground (slightly embedded by the bevel)
  g.computeVertexNormals();
  return g;
}
// gable roof with eaves: a manual prism, overhung and slightly flared
function gableRoof(w,h,d,over){
  const o=over||0.35, W=w/2+o, D=d/2+o, lift=-0.12;
  const P=[ -W,lift,-D,  W,lift,-D,  W,lift,D,  -W,lift,D,  0,h,-D+o*0.4,  0,h,D-o*0.4 ];
  const idx=[0,4,1, 1,4,5, 1,5,2, 2,5,3, 3,5,4, 3,4,0, 0,1,2, 0,2,3];
  const pos=[];
  for(const i of idx) pos.push(P[i*3],P[i*3+1],P[i*3+2]);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.computeVertexNormals();
  return g;
}
// a classical column: base, entasis shaft, capital
function columnGeo(r,h){
  return latheGeo([
    [r*1.7,0],[r*1.7,r*0.5],[r*1.25,r*0.7],[r*1.08,h*0.12],
    [r,h*0.5],[r*0.92,h*0.82],[r*1.15,h*0.88],[r*1.5,h*0.94],[r*1.55,h],[0,h]
  ],26);
}
// dome on a drum, with an oculus rim
function domeGeo(r,drumH){
  const pts=[[r*1.05,0],[r*1.05,drumH*0.85],[r*1.12,drumH]];

    const t=a/9*Math.PI/2;
    pts.push([Math.cos(t)*r, drumH+Math.sin(t)*r*0.92]);

function bellGeo(r,h){

// standing stone / rock: noise-displaced icosahedron
function blobGeo(r,detail,mag,seedOff){
  const g=new THREE.IcosahedronGeometry(r,detail||2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const n=1+SIMPLEX(x*0.9+seedOff,y*0.9,z*0.9)*mag;
    p.setXYZ(i,x*n,y*n,z*n);
  }
  g.computeVertexNormals();
  return g;
}
// tree canopy: two or three soft blobs on a tapered trunk (merged)
function treeGeo(seedOff){
  const trunk=latheGeo([[0.22,0],[0.16,1.2],[0.1,2.2],[0,2.3]],12);
  const parts=[trunk];
  const n=2+Math.floor(Math.abs(Math.sin(seedOff*13.7))*2);
  for(let i=0;i<n;i++){
    const b=blobGeo(0.95-i*0.16,2,0.28,seedOff+i*3.3);
    b.translate(Math.sin(seedOff+i*2.4)*0.5, 2.1+i*0.75, Math.cos(seedOff*1.7+i)*0.5);
    parts.push(b);

  return mergeGeos(parts);
}

// a real fire: log tepee in a stone ring; the flames are added by makeFire
function firewoodGeo(seedOff){
  const parts=[];
  for(let i=0;i<6;i++){
    const a=i/6*TAU+seedOff;
    const log=new THREE.CylinderGeometry(0.07,0.09,1.5,7);
    log.rotateZ(0.42); log.rotateY(a);
    log.translate(Math.cos(a)*0.28,0.6,Math.sin(a)*0.28);
    parts.push(log);
  }
  for(let i=0;i<9;i++){

    st.translate(Math.cos(a)*0.85,0.06,Math.sin(a)*0.85);

function flameGeo(){

// low ornament wall with crenellations, along x, centered
function crenelWall(len,h){
  const parts=[bevelBox(len,h,0.5,0.06)];
  const n=Math.max(2,Math.floor(len/1.1));
  for(let i=0;i<n;i++){
    const m=bevelBox(0.42,0.3,0.54,0.04);
    m.translate(-len/2+ (i+0.5)*(len/n),h,0);
    parts.push(m);

  return mergeGeos(parts);

// a box placed: the workhorse of the framing carpenter
function boxAt(list,w,h,d,x,y,z,ry,rz){
  const g=new THREE.BoxGeometry(w,h,d);
  if(rz) g.rotateZ(rz);
  if(ry) g.rotateY(ry);
  g.translate(x,y,z);
  list.push(g);
  return g;
}
// course strips, ridge cap, and fascia boards laid over a gable roof, so a
// roof reads as shingled work rather than a smooth triangle
function roofDressing(list,w,p,d,over,rows){
  const W=w/2+over, th=Math.atan2(p,W);
  const n=rows||4;
  for(let side=-1;side<=1;side+=2){
    for(let i=1;i<=n;i++){
      const t=i/(n+1);
      boxAt(list,0.09,0.07,d+over*1.7, side*W*(1-t), -0.06+p*t+0.05, 0, 0, side*-th);
    }
    boxAt(list,0.08,0.2,d+over*1.9, side*W*0.98, 0, 0, 0, side*-th*0.3); // fascia
  }
  boxAt(list,0.24,0.12,d+over*1.4, 0, p+0.04, 0);                         // ridge cap
}

/* ============================================================

const Bubble = { scene:null, setId:-1, people:[], rite:null, riteT:0, buildRand:null, nPeople:0 };

function buildBubbleShared(){

// a living fire: wood, stones, three nested flame layers, a flickering light
function makeFire(scaleMul,at){
  const k=scaleMul||1;
  const grp=new THREE.Group();
  const wood=new THREE.Mesh(firewoodGeo(at.x+at.z),new THREE.MeshLambertMaterial({color:0x4a3220}));
  wood.scale.setScalar(k); wood.castShadow=true; grp.add(wood);
  const flames=[];
  const cols=[[0xff5a10,0.4],[0xff9a28,0.55],[0xffe088,0.85]];
  for(let i=0;i<3;i++){
    const fm=new THREE.Mesh(Bubble.flameG,new THREE.MeshBasicMaterial({color:cols[i][0],
      transparent:true,opacity:cols[i][1],blending:THREE.AdditiveBlending,depthWrite:false}));
    const s=(1.15-i*0.3)*k;
    fm.scale.set(s,s*(1.1+i*0.12),s);
    fm.position.y=0.28*k+i*0.1*k;
    grp.add(fm); flames.push(fm);
  }
  const light=new THREE.PointLight(0xff9040,1.5*k,30*k);
  light.position.y=1.4*k; grp.add(light);
  grp.position.copy(at);
  Bubble.group.add(grp);
  const fire={grp,flames,light,phase:Math.random()*TAU,k};
  (Bubble.fires=Bubble.fires||[]).push(fire);
  return fire;
}
function removeFire(fire){
  if(!fire) return;
  Bubble.group.remove(fire.grp);
  fire.grp.traverse(o=>{
    if(o.material&&o.material.dispose) o.material.dispose();
    if(o.geometry&&o.geometry!==Bubble.flameG&&o.geometry.dispose) o.geometry.dispose();
  });
  if(Bubble.fires) Bubble.fires=Bubble.fires.filter(f=>f!==fire);
}
function mergeGeos(list){
  // merge position+normal, tolerating mixed indexed and non-indexed input
  const flat=list.map(g=>g.index?g.toNonIndexed():g);
  let total=0;
  for(const g of flat) total+=g.attributes.position.count;
  const pos=new Float32Array(total*3), norm=new Float32Array(total*3);
  let off=0;
  for(const g of flat){
    pos.set(g.attributes.position.array,off*3);
    norm.set(g.attributes.normal.array,off*3);
    off+=g.attributes.position.count;
  }
  const out=new THREE.BufferGeometry();

}

/* Each culture builds in its own manner, learned from the land of its
   capital: adobe and flat roofs in the drylands, dark timber and steep
   slate in the cold, plaster and terracotta in the temperate belts. */
function cultureStyle(cu,biome){
  // the culture sets the palette family; the local land sets the materials
  const S=makeStream(World.seed,'culturestyle'+cu);
  if(biome===BIOME.DESERT||biome===BIOME.STEPPE) return {
    wall:[0.08+S()*0.03,0.32+S()*0.1,0.58+S()*0.07],
    roofKind:S()<0.7?'flat':'gable', roof:[0.08,0.25,0.5+S()*0.06], aspect:0.8, dry:true };
  if(biome===BIOME.TUNDRA||biome===BIOME.ALPINE) return {
    wall:[0.07,0.2+S()*0.08,0.36+S()*0.07],
    roofKind:'steep', roof:[0.6+S()*0.08,0.1,0.26+S()*0.06], aspect:1.2, dry:false };
  if(biome===BIOME.FOREST||biome===BIOME.MARSH) return {
    wall:[0.08,0.3+S()*0.06,0.44+S()*0.08],
    roofKind:S()<0.5?'steep':'gable', roof:[0.1+S()*0.04,0.4,0.34+S()*0.05], aspect:1.05, dry:false };
  // temperate lands build in one of three traditions per culture:
  // warm plaster, grey fieldstone, or dark timber
  const fam=rint(S,0,2);
  if(fam===0) return {
    wall:[0.07+S()*0.04,0.3+S()*0.1,0.58+S()*0.08],
    roofKind:'gable', roof:[0.02+S()*0.05,0.5,0.3+S()*0.08], aspect:0.95+S()*0.2, dry:false };
  if(fam===1) return {
    wall:[0.09+S()*0.03,0.06+S()*0.05,0.5+S()*0.07],
    roofKind:S()<0.4?'steep':'gable', roof:[0.6+S()*0.05,0.08,0.3+S()*0.05], aspect:1.0+S()*0.15, dry:false };
  return {
    wall:[0.07,0.28+S()*0.08,0.4+S()*0.06],
    roofKind:S()<0.5?'steep':'gable', roof:[0.1+S()*0.03,0.35,0.5+S()*0.08], aspect:1.1+S()*0.15, dry:false };
}

}
function enterBubble(setId){
  if(Bubble.setId===setId&&Bubble.built) return;

  const B=makeStream(World.seed,'bubble'+setId);   // deterministic per settlement

  const biomeCol=BIOME_COL[c.biome]||BIOME_COL[BIOME.GRASS];

    const x=gp.getX(i),z=gp.getZ(i);
    const d=Math.sqrt(x*x+z*z);
    const h=SIMPLEX(x*0.02+setId,0,z*0.02)*2.2*smoothstep(clamp01((d-30)/60))
      + SIMPLEX2(x*0.008,5,z*0.008)*5*smoothstep(clamp01((d-60)/100));
    gp.setY(i,h);

    gc[i*3]=biomeCol[0]*v*1.1; gc[i*3+1]=biomeCol[1]*v*1.1; gc[i*3+2]=biomeCol[2]*v*1.08;
  }
  gg.setAttribute('color',new THREE.BufferAttribute(gc,3));
  gg.computeVertexNormals();
  Bubble.groundMat=new THREE.MeshLambertMaterial({vertexColors:true});
  const groundMesh=new THREE.Mesh(gg,Bubble.groundMat);
  groundMesh.receiveShadow=true;
  Bubble.group.add(groundMesh);

  const dom=dominantFaith(s);
  const f=dom!==null?World.faiths[dom]:null;

    new THREE.MeshLambertMaterial({map:makePavingTexture(B)}));

  plaza.receiveShadow=true;
  Bubble.group.add(plaza);

    new THREE.MeshLambertMaterial({color:0x8a7a5e}));
  kerb.rotation.x=-Math.PI/2; kerb.position.y=0.06; kerb.receiveShadow=true; kerb.castShadow=true;
  Bubble.group.add(kerb);
  if(f) buildTemple(f,v3(0,0,-14),B);
  else if(s.ruins.length) buildRuin(v3(0,0,-14),B);
  // secondary shrine for a strong minority
  const minor=Object.entries(s.pool).filter(([k,v])=>+k!==dom&&v>0.25&&World.faiths[k]&&!World.faiths[k].deadYear)[0];
  if(minor) buildTemple(World.faiths[minor[0]],v3(26,0,10),B,0.55);

// flagstone paving, drawn once per settlement: concentric courses of stone
function makePavingTexture(B){
  const cv=document.createElement('canvas'); cv.width=cv.height=512;
  const g=cv.getContext('2d');
  g.fillStyle='#6a5c44'; g.fillRect(0,0,512,512);   // grout
  const cx=256, cy=256;
  for(let ring=0; ring<11; ring++){
    const r0=18+ring*22, r1=r0+20;
    const n=Math.max(6,Math.round(r0*0.28));
    const off=B()*TAU;
    for(let i=0;i<n;i++){
      const a0=i/n*TAU+off+0.008, a1=(i+1)/n*TAU+off-0.008;
      const l=0.56+ (B()-0.5)*0.14;
      g.fillStyle=hslCss(38+(B()-0.5)*10, 0.16+B()*0.08, l);
      g.beginPath();
      g.arc(cx,cy,r1,a0,a1); g.arc(cx,cy,r0,a1,a0,true);
      g.closePath(); g.fill();
    }
  }
  // center medallion
  g.strokeStyle='#8a6d1d'; g.lineWidth=5;
  g.beginPath(); g.arc(cx,cy,16,0,TAU); g.stroke();
  const tex=new THREE.CanvasTexture(cv);
  return tex;
}
function groundY(x,z,setId){
  const d=Math.sqrt(x*x+z*z);
  return SIMPLEX(x*0.02+setId,0,z*0.02)*2.2*smoothstep(clamp01((d-30)/60))
    + SIMPLEX2(x*0.008,5,z*0.008)*5*smoothstep(clamp01((d-60)/100));
}
function pickPoolFaith(s,B){
  let x=B();
  for(const k in s.pool){ x-=s.pool[k]; if(x<=0) return +k; }
  return dominantFaith(s);
}
function disposeBubbleContent(){

      if(o.material&&o.material.map&&o.material.map.dispose) o.material.map.dispose();
